  return kind ? `<span class="dur ${kind}"><span></span></span><span class="dur-label">${kind === 'long' ? 'долго' : 'коротко'}</span>` : '';
}
// Слова, изученные на тропе до станции (и только они попадают в задания)
function learnedBefore(stationId){
  const ids = new Set();
  for(const { lesson } of flatLessons()){
    if(lesson.id === stationId) break;
    lesson.words.forEach(w=>ids.add(w.id));
  }
  return ids;
}
function soundWords(st){
  const learned = learnedBefore(st.id);
  const pick = side => st.spec[side].words.map(wordByEn).filter(w=>w && learned.has(w.id) && soundAt(w, st.spec[side]) > -1);
  return { a: pick('a'), b: pick('b') };
}
function soundCard(spec, side, words, cls){
  const s = spec[side];
  return { type:'rule', title:s.name, text:s.text,
    body:`<div class="mouth-row">${mouthSvg(s.mouth)}${s.dur ? `<div class="dur-wrap">${durBar(s.dur)}</div>` : `<div class="sound-tag">${s.tag}</div>`}</div>`
      + words.slice(0, 5).map(w=>exampleRow(w.en, w.emoji ? wImg(w, 40) : '', soundHtml(w, s, cls), w.ru)).join('') };
}
function buildSoundSteps(st){
  const spec = st.spec;
  const { a, b } = soundWords(st);
  const steps = [soundCard(spec, 'a', a, 'ph-i'), soundCard(spec, 'b', b, 'ph-ee')];
  const learned = new Set([...a, ...b].map(w=>w.id));
  const pairs = (spec.pairs || []).map(p=>p.map(wordByEn)).filter(p=>p.every(w=>w && learned.has(w.id)));
  const showcase = pairs[0] || [a[0], b[0]];
  steps.push({ type:'rule', title:spec.title, text:spec.compare || '',
    body:`<div class="pair-cards">${showcase.map((w, i)=>{
      const side = i === 0 ? spec.a : spec.b;
      return `<button class="pair-card" onclick="speak(${jsq(w.en)})">
          ${w.emoji ? wImg(w, 70) : ''}
          <span class="pair-word">${soundHtml(w, side, i === 0 ? 'ph-i' : 'ph-ee')}</span>
          <span class="dur-wrap">${side.dur ? durBar(side.dur) : `<span class="sound-tag">${side.tag}</span>`}</span>
        </button>`;
    }).join('')}</div>` });

  const both = [...a.map(w=>({ w, side:'a' })), ...b.map(w=>({ w, side:'b' }))];
  const sample = n => { const out = []; let pool = []; while(out.length < n){ if(!pool.length) pool = shuffle(both); out.push(pool.pop()); } return out; };
  const fb = w => ({ fbEn:w.en, fbRu:w.ru });
  const pickSound = ({ w, side }) => ({ type:'pickSound', scored:true, id:w.id, say:w.en, answer:side,
    sides:[['a', spec.a], ['b', spec.b]].map(([key, s])=>({ key, label:s.label, tag:s.tag, dur:s.dur, cls: key === 'a' ? 'ph-i' : 'ph-ee' })), ...fb(w) });
  const spellGap = ({ w, side }) => {
    const s = spec[side], at = soundAt(w, s);
    return { type:'spellGap', scored:true, id:w.id, pre:w.en.slice(0, at), post:w.en.slice(at + s.label.length),
      answer:s.label, options:shuffle([spec.a.label, spec.b.label]), ...fb(w) };
  };
  if(pairs.length){
    for(let i = 0; i < 4; i++){
      const p = pairs[i % pairs.length], w = p[Math.random() < .5 ? 0 : 1];
      steps.push({ type:'pickPic', scored:true, say:w.en, options:shuffle(p.map(x=>x.id)), answer:w.id, ...fb(w) });
    }
  }
  const sameLetters = spec.a.label === spec.b.label;
  if(spec.kind === 'letters' && !sameLetters) sample(10).forEach(x=>steps.push(spellGap(x)));
  else if(spec.kind === 'reading' || sameLetters) sample(10).forEach(x=>steps.push(pickSound(x)));
  else { sample(5).forEach(x=>steps.push(pickSound(x))); sample(5).forEach(x=>steps.push(spellGap(x))); }

  const line = (ws, side, cls) => ({ en: ws.map(w=>w.en).join(', ') + '!', html: ws.map(w=>soundHtml(w, side, cls)).join(', ') + '!', ru: ws.map(w=>w.ru).join(', ') });
  steps.push({ type:'twister', lines:[line(shuffle(a).slice(0, 3), spec.a, 'ph-i'), line(shuffle(b).slice(0, 3), spec.b, 'ph-ee')] });
  return steps;
}
function soundChips(st){
  const { a, b } = soundWords(st);
  return [...a.slice(0, 5).map(w=>[w, st.spec.a, 'ph-i']), ...b.slice(0, 5).map(w=>[w, st.spec.b, 'ph-ee'])].map(([w, s, cls])=>
    `<button class="word-chip" onclick="speak(${jsq(w.en)})" aria-label="Послушать">${wImg(w, 40)}<span>${soundHtml(w, s, cls)}</span></button>`).join('');
}

/* ---- Общее для всех станций ---- */
function buildStationSteps(st){
  if(st.topic === 'plural') return buildPluralSteps();
  return st.type === 'sound' ? buildSoundSteps(st) : buildGrammarSteps(st.spec);
}
function stationChips(st){
  if(st.topic === 'plural') return pluralChips();
  return st.type === 'sound' ? soundChips(st) : grammarChips(st.spec);
}
// Картинка станции на тропе
function stationPicWords(st){
  if(st.topic === 'plural') return [WORD_BY_ID.animals_1_cat, WORD_BY_ID.animals_1_cat];
  if(st.type === 'sound'){
    const first = side => st.spec[side].words.map(wordByEn).find(w=>w && w.emoji);
    return [first('a'), first('b')].filter(Boolean);
  }
  const fr = (st.spec.story && st.spec.story.frames) || [];
  for(const f of fr){
    const ws = String(f[2] || '').split(',').map(wordByEn).filter(w=>w && w.emoji);
    if(ws.length) return ws.slice(0, 2);
  }
  return [];
}

/* ---- Запись своего голоса (скороговорка) ---- */
async function recordSelf(btn){
  if(!navigator.mediaDevices || !window.MediaRecorder){ btn.textContent = 'Запись не поддерживается'; btn.disabled = true; return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      if(session) session.recordingUrl = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      btn.classList.remove('rec'); btn.innerHTML = `${icon('mic',22)} Записать ещё раз`;
      const play = document.getElementById('playSelf'); if(play) play.hidden = false;
    };
    stopAllSpeech();
    rec.start();
    btn.classList.add('rec'); btn.textContent = 'Говори… 4 секунды';
    setTimeout(()=>rec.state !== 'inactive' && rec.stop(), 4000);
  }catch(e){
    btn.textContent = 'Нет доступа к микрофону'; btn.disabled = true;
  }
}
function playSelf(){ if(session && session.recordingUrl){ stopAllSpeech(); new Audio(session.recordingUrl).play(); } }

function sceneCard(id, n){ return `<div class="scene-card">${sceneHtml(id, n, sceneSize(n))}</div>`; }
function bigListen(say){ return `<button class="listen-btn" onclick="speak(${jsq(say)})" aria-label="Послушать">${icon('speaker',60)}</button>`; }

function yesNoButtons(answer){

function renderGrammarScreen(){
  const step = currentStep();
  const pct = Math.round(session.stepIdx / session.steps.length * 100);
  const lesson = SECTIONS.find(s=>s.id===session.sectionId).lessons.find(l=>l.id===session.lessonId);
  return `
    <div class="lesson-top">
      <button class="round-btn" onclick="exitLesson()" aria-label="Выйти со станции">${icon('close',26)}</button>
      <div class="lprogress"><div class="lprogress-fill" style="width:${pct}%"></div></div>
      <div class="lesson-pic">${lessonPicHtml(lesson, 44)}</div>
    </div>
    ${step.retry ? `<div class="retry-tag">${icon('reset',16)} Повторим ещё раз</div>` : ''}
    ${GRAM_RENDER[step.type](step)}
  `;
}
function grammarAfterRender(){
  const step = currentStep();
  const sayLater = text => setTimeout(()=>{ if(session && currentStep() === step) speak(text); }, 400);
  if(['pickScene', 'pickPic', 'pickSound'].includes(step.type)) sayLater(step.say);
  if(step.type === 'story') sayLater(step.frames[step.frame].en);
  if(step.type === 'question') sayLater(step.q);
  if(step.type === 'typeWord' || step.type === 'typeGap'){ const el = document.getElementById('gramInput'); if(el) el.focus(); }
}

// Общий итог любого задания: запоминаем результат, ошибку ставим на повтор в конец
function gramResult(ok){
  const step = currentStep();
  if(step.done) return;
  step.done = true;
  if(step.scored) step.result = ok;
  if(!ok && !step.retry){
    const again = step.type === 'build' ? { ...step, bank: shuffle(step.bank) } : { ...step };
    session.steps.push({ ...again, done:false, retry:true, scored:false });
  }
  if(ok){ soundCorrect(); vibrate(50); speak(step.fbEn); }
  else { soundWrong(); setTimeout(()=>speak(step.fbEn), 350); }
  setTimeout(()=>showFeedback(ok, { en: step.fbEn, ru: step.fbRu, note: step.note }), 450);
}
function gramChoose(btn){
  const step = currentStep();
  if(step.done) return;
  const ok = btn.dataset.ok === 'true';
  btn.classList.add(ok ? 'correct' : 'wrong');
  if(!ok){ const right = [...btn.parentElement.children].find(b=>b.dataset.ok === 'true'); if(right) right.classList.add('correct'); }
  const gap = document.getElementById('gap');
  if(gap){ gap.textContent = step.answer; gap.classList.add(ok ? 'ok' : 'bad'); }
  gramResult(ok);
}
function gramFix(btn){
  const step = currentStep();
  if(step.done) return;
  const ok = btn.dataset.ok === 'true';
  const right = [...btn.parentElement.children].find(b=>b.dataset.ok === 'true');
  if(!ok) btn.classList.add('wrong');
  // Ошибочное слово превращается в правильное
  right.innerHTML = step.fixed;
  right.classList.add('correct');
  gramResult(ok);
}
const normAnswer = s => String(s).trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ');
function gramTypeCheck(){
  const step = currentStep();
  if(step.done) return;
  const el = document.getElementById('gramInput');
  const val = normAnswer(el.value);
  if(!val){ el.focus(); return; }
  const ok = val === normAnswer(step.answer);
  el.classList.add(ok ? 'correct' : 'wrong');
  if(!ok) el.value = step.answer;
  el.disabled = true;
  gramResult(ok);
}

/* ---- Сборка фразы из блоков ---- */
function buildOrder(){ return session.buildOrder || (session.buildOrder = []); }
function buildDraw(){
  const step = currentStep();
  const order = buildOrder();
  const line = document.getElementById('buildLine');
  line.innerHTML = order.length
    ? order.map(i=>`<button class="wblock in-line" onclick="buildTap(${i})">${esc(step.bank[i])}</button>`).join('')
    : `<span class="build-hint">нажимай на слова по порядку</span>`;
  step.bank.forEach((_, i)=>document.getElementById(`wb-${i}`).classList.toggle('used', order.includes(i)));
  document.getElementById('buildCheckBtn').disabled = order.length === 0;
}
function buildTap(i){
  const step = currentStep();
  if(step.done) return;
  soundClick();
  const order = buildOrder();
  const at = order.indexOf(i);
  if(at > -1) order.splice(at, 1); else { order.push(i); speak(step.bank[i]); }
  buildDraw();
}
function buildReset(){ if(currentStep().done) return; session.buildOrder = []; buildDraw(); }
function buildCheck(){
  const step = currentStep();
  if(step.done) return;
  const ok = normAnswer(buildOrder().map(i=>step.bank[i]).join(' ')) === normAnswer(step.answer.join(' '));
  document.getElementById('buildLine').classList.add(ok ? 'ok' : 'bad');
  gramResult(ok);
}

/* ---- История ---- */
function storyNext(){
  const step = currentStep();
  soundClick();
  if(step.frame < step.frames.length - 1){ step.frame++; render(); }
  else gramNext();
}

function gramNext(){
  if(!session || session.kind !== 'station') return;
  session.buildOrder = [];
  session.stepIdx++;
  if(session.stepIdx >= session.steps.length){ finishSession(); return; }
  render();
}

// Звёзды станции: доля заданий, решённых с первой попытки (повторы не считаются)
function applyGrammarResult(){
  const scored = session.steps.filter(s=>s.scored);
  const r = scored.length ? scored.filter(s=>s.result === true).length / scored.length : 1;
  const stars = r >= 0.9 ? 3 : r >= 0.7 ? 2 : 1;
  const key = 'g_' + session.lessonId;
  const prev = appState.progress[key] || 0;
  if(stars > prev){ appState.progress[key] = stars; return stars - prev; }
  return 0;
}

/* ---- Карточки слов: подсветка ee и строчка про хитреца ---- */
function phonicsHtml(en){ return esc(en).replace(/ee/g, '<b class="ph-ee">ee</b>'); }
function trickyLine(w){
  if(!TRICKY[w.id] || !appState.progress['g_animals_plural']) return '';

/* ---- Автопроверка: в станциях только изученные слова ---- */
// Слово в станции допустимо, если оно изучено на тропе раньше, объяснено в этой или прошлой станции (explains)
// или это форма изученного слова, которую уже объяснили: множественное число, he eats, played, playing.
const STATION_FLAGS = { plural:['plurals'], present_simple:['verbS'], past_regular:['verbEd'], want_to:['verbIng'] };
function wordForms(w, flags){
  const forms = [];
  const base = w.en.toLowerCase();
  if(base.includes(' ')) return forms;
  const pos = (w.pos || '').split(':')[0];
  if(flags.has('plurals') && pos === 'n') forms.push(pluralOfWord(w));
  if(pos === 'v'){
    const cons = /[^aeiou][aeiou][bdgmnprt]$/.test(base);
    const e = base.endsWith('e');
    if(flags.has('verbS')) forms.push(/(s|x|z|ch|sh|o)$/.test(base) ? base + 'es' : /[^aeiou]y$/.test(base) ? base.slice(0, -1) + 'ies' : base + 's');
    if(flags.has('verbEd')) forms.push(e ? base + 'd' : /[^aeiou]y$/.test(base) ? base.slice(0, -1) + 'ied' : cons ? base + base.slice(-1) + 'ed' : base + 'ed', base + 'ed');
    if(flags.has('verbIng')) forms.push(e && !base.endsWith('ee') ? base.slice(0, -1) + 'ing' : cons ? base + base.slice(-1) + 'ing' : base + 'ing', base + 'ing');
  }
  return forms;
}
function stationTexts(st, steps){
  const texts = [];
  if(st.topic !== 'plural' && st.type === 'grammar'){
    st.spec.items.forEach(([en])=>texts.push(en));
    st.spec.rules.forEach(r=>r.ex.forEach(([en])=>texts.push(en)));
    if(st.spec.story){
      st.spec.story.frames.forEach(([en])=>texts.push(en));
      st.spec.story.questions.forEach(([q, , options])=>texts.push(q, ...options));
    }
    return texts;
  }
  steps.forEach(s=>{
    if(s.fbEn) texts.push(s.fbEn);
    if(s.q) texts.push(s.q, ...s.options);
    if(s.answer && Array.isArray(s.answer)) texts.push(...s.answer);
    if(s.frames) s.frames.forEach(f=>texts.push(f.en));
    if(s.lines) s.lines.forEach(l=>texts.push(l.en));
  });
  return texts;
}
function stationProblems(){
  const known = new Set(), learned = [], flags = new Set();
  const problems = [];
  const tokens = text => text.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z'\s-]/g, ' ').split(/[\s-]+/).map(t=>t.replace(/^'+|'+$/g, '')).filter(Boolean);
  const okToken = tok => {
    if(known.has(tok)) return true;
    if(tok.endsWith("'s") && known.has(tok.slice(0, -2))) return true;
    return learned.some(w=>wordForms(w, flags).includes(tok));
  };
  flatLessons().forEach(({lesson})=>{
    if(lesson.kind !== 'station'){
      lesson.words.forEach(w=>{ learned.push(w); tokens(w.en).forEach(t=>known.add(t)); });
      // Примеры для слов без картинки — по тому же правилу: только изученные к этому уроку слова
      lesson.words.filter(w=>!w.emoji).forEach(w=>{
        const ex = exampleOf(w);
        if(!ex){ problems.push({ station: 'Примеры', words: [`нет примера для «${w.en}»`] }); return; }
        const bad = tokens(examplePlain(ex[0])).filter(tok=>!okToken(tok));
        if(bad.length) problems.push({ station: `пример к «${w.en}»`, words: bad });
      });
      return;
    }
    const st = lesson.station;
    (st.spec.explains || []).forEach(t=>known.add(t.toLowerCase()));
    (STATION_FLAGS[st.topic] || []).forEach(f=>flags.add(f));
    if(st.type === 'sound'){
      const ids = new Set(learned.map(w=>w.id));
      ['a', 'b'].forEach(side=>{
        const words = st.spec[side].words;
        const missing = words.filter(en=>!wordByEn(en));
        const ok = words.map(wordByEn).filter(w=>w && ids.has(w.id) && soundAt(w, st.spec[side]) > -1);
        if(missing.length) problems.push({ station: st.title, words: missing.map(m=>`нет в словаре: ${m}`) });
        if(ok.length < 3) problems.push({ station: st.title, words: [`мало изученных слов для «${st.spec[side].label}»: ${ok.length}`] });
      });
      return;
    }
    const bad = new Set();
    stationTexts(st, buildStationSteps(st)).forEach(t=>tokens(t).forEach(tok=>{ if(!okToken(tok)) bad.add(tok); }));
    if(bad.size) problems.push({ station: st.title, words: [...bad] });
  });
  return problems;
}
function stationCheckHtml(){
  const p = stationProblems();
  if(!p.length) return `<div class="check-note ok">${icon('check',16)} Проверка: во всех ${STATIONS.length} станциях и примерах только изученные слова</div>`;
  return `<div class="check-note bad">Проверка слов: ${p.map(x=>`«${esc(x.station)}»: ${esc(x.words.join(', '))}`).join('; ')}</div>`;
}

/* ---- ПЕРЕХОДЫ ---- */
function afterRender(){
  popupAfterRender();
  if(screen==='map'){
    // Прокручиваем тропу к текущему уроку, чтобы не листать 100+ кружков
    const scroller = document.querySelector('.screen');
    if(mapRestore !== null) scroller.scrollTop = mapRestore;
    else { const top = currentNodeTop(scroller); if(top !== null) scroller.scrollTop = top; }
    scroller.addEventListener('scroll', updateMapButtons, { passive:true });
    updateMapButtons();
  }
  if(screen==='lesson' && session.kind === 'station') grammarAfterRender();
  if(screen==='lesson' && session.kind !== 'station'){
    const stageKey = session.stages[session.stageIdx];
    if(stageKey === 'typing' || stageKey === 'dictation'){
      const idxs = getInputIdxs(); if(idxs.length) focusCell(idxs[0]);
    }
    // В диктанте слово звучит сразу — читать ребёнку не нужно
    if(stageKey === 'dictation'){
      const w = currentWord();
      setTimeout(()=>{ if(session && currentWord() === w) speak(w.en); }, 400);
    }
  }
}
function nextInStage(){
  if(!session || screen !== 'lesson') return;
  if(session.kind === 'station'){ gramNext(); return; }
  if(session.wordIdx < session.words.length - 1){ session.wordIdx++; }
  else {
    session.wordIdx = 0;
    session.stageIdx++;
    if(session.stageIdx >= session.stages.length){ finishSession(); return; }
  }
  render();
}

// Переносит звёзды из текущей сессии в прогресс (только если стало больше). Возвращает прирост.
function applySessionResults(){
  let gained = 0;
  session.words.forEach(w=>{
    const r = session.results[w.id];
    const stars = (r.rec?1:0) + (r.asm?1:0) + ((r.typ && r.dic) ? 1 : 0);
    const prevStars = appState.progress[w.id] || 0;
    if(stars > prevStars){ gained += (stars - prevStars); appState.progress[w.id] = stars; }
  });
  return gained;
}

function finishSession(){
  const sessionStarsGained = session.kind === 'station' ? applyGrammarResult() : applySessionResults();
  const doneLesson = SECTIONS.find(s=>s.id===session.sectionId).lessons.find(l=>l.id===session.lessonId);
  track(session.kind === 'station' ? 'станция пройдена' : 'урок пройден', doneLesson.title);
  markActiveToday();
  saveState();
  screen = 'sessionEnd';
  session.lastGained = sessionStarsGained;
  render();
  fireConfetti();
  // Каждая звезда «выпрыгивает» со своим звуком, потом общий праздничный аккорд
  const lesson = SECTIONS.find(s=>s.id===session.sectionId).lessons.find(l=>l.id===session.lessonId);
  const n = lessonStarCount(lesson);
  for(let i=0; i<n; i++) setTimeout(()=>playTone(660 + i*130, 0.16), 350 + i*350);
  setTimeout(soundCelebrate, 400 + n*350);
}

function fireConfetti(){
  const app = document.getElementById('app');
  const colors = ['#5DB043','#4FB3E3','#FFC83D','#EF5F57','#F2AE1F','#B98AE0'];
  for(let i=0;i<46;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 7 + Math.random()*7;
    piece.style.width = size+'px';
    piece.style.height = (Math.random() < .5 ? size : size*0.5)+'px';
    piece.style.left = Math.random()*100+'%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (1.6 + Math.random()*1.6)+'s';
    piece.style.animationDelay = (Math.random()*0.4)+'s';
    app.appendChild(piece);
    setTimeout(()=>piece.remove(), 3800);
  }
}

/* ============================= ФИНАЛ УРОКА ============================= */
function renderSessionEnd(){
  const section = SECTIONS.find(s=>s.id===session.sectionId);
  const lesson = section.lessons.find(l=>l.id===session.lessonId);
  const starCount = lessonStarCount(lesson);
  const gained = session.lastGained || 0;
  const flat = flatLessons();
  const nextIdx = flat.findIndex(f=>f.lesson.id===lesson.id) + 1;
  const nextEntry = nextIdx < flat.length && isLessonUnlocked(nextIdx) ? flat[nextIdx] : null;
  const next = nextEntry && lessonStarCount(nextEntry.lesson) < 3 ? nextEntry.lesson : null;
  const nextIsNew = next && lessonStars(next) === 0;

  const starsHtml = [0,1,2].map(i=>
    `<span class="end-star" style="animation-delay:${0.3 + i*0.35}s">${icon(i < starCount ? 'star' : 'starEmpty', i===1 ? 86 : 66)}</span>`
  ).join('');
  const isGrammar = lesson.kind === 'station';
  const isSound = isGrammar && lesson.station.type === 'sound';
  const wordsHtml = isGrammar
    ? stationChips(lesson.station)
    : lesson.words.map(w=>
        `<button class="word-chip" onclick="speak(${jsq(w.en)})" aria-label="Послушать ${w.en}">${wImg(w,46)}<span>${w.en}</span></button>`
      ).join('');

  return `
    <div class="end-wrap">
      <div class="end-hero">
        <div class="end-stars">${starsHtml}</div>
        <div class="end-worm">${wormSvg('celebrate')}</div>
        <h1 class="end-title">${isSound ? 'Звуки пойманы!' : isGrammar ? 'Станция пройдена!' : 'Урок пройден!'}</h1>
        <div class="end-sub">${lesson.title}</div>
        <div class="end-chip ${gained > 0 ? 'gain' : ''}">${gained > 0 ? `${icon('star',28)} +${gained}` : 'Отличное повторение!'}</div>
      </div>
      ${nextIsNew ? `
        <div class="unlock-card" style="--c:${nextEntry.section.color};">
          <div class="unlock-pic">${lessonPicHtml(next, 38)}</div>
          <div>
            <div class="unlock-title">${next.kind === 'station' ? (next.station.type === 'sound' ? 'Открыта станция звуков!' : 'Открыта станция правил!') : 'Открыт новый урок!'}</div>
            <div class="unlock-sub">${next.title}</div>
          </div>
        </div>` : ''}
      <div class="section-label">${isSound ? 'Слова станции' : isGrammar ? 'Фразы станции' : 'Слова урока'}</div>
      <div class="word-chips">${wordsHtml}</div>
    </div>
    <div class="end-actions">
      ${next ? `<button class="btn btn-primary" onclick="openLesson('${next.id}')"><span class="btn-label">Следующий урок ${icon('arrow',22)}</span></button>` : ''}
      <button class="btn ${next ? 'btn-outline' : 'btn-primary'}" onclick="session=null; goTo('map')"><span class="btn-label">${icon('map',26)} На тропу</span></button>
      <button class="btn btn-ghost" onclick="session=null; goTo('pet')">К другу</button>
    </div>
  `;
}

    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    return;
  }
  const worn = wornAccessories(totalStarsEarned());
  if(worn.includes(id)){
    appState.petOff = [...new Set([...appState.petOff, id])];
  } else {
    appState.petOff = appState.petOff.filter(x=>x!==id);
    // Надели головной убор — другой снимаем
    if(a.head) ACCESSORIES.filter(o=>o.head && o.id!==id).forEach(o=>{ if(!appState.petOff.includes(o.id)) appState.petOff.push(o.id); });
  }
  saveState();
  soundCorrect();
  render();
  petTap(false);
}

function petSvg(stageIdx, worn, species = 'chick'){
  const has = id => worn.includes(id);
  const label = FRIENDS.find(f=>f.species === species).names[stageIdx];
  const trophy = has('trophy') ? `<g transform="translate(190 150) scale(1.2)">${ACC_ART.trophy}</g>` : '';
  const shadowW = stageIdx === 0 ? 50 : 22 + 52*PET_SCALE[stageIdx];
  const shadow = `<ellipse cx="100" cy="172" rx="${shadowW}" ry="8" fill="rgba(50,90,30,.25)"/>`;

  if(stageIdx === 0){
    return `<svg viewBox="0 0 200 190" class="pet-svg ${species === 'fox' ? 'pet-sleep' : 'pet-egg'}" aria-label="${label}">${shadow}${trophy}
      <g transform="translate(100 170)"><g class="pet-bob">${PET_EGG[species]}</g></g></svg>`;
  }

  const s = PET_SCALE[stageIdx];
  const head = has('crown') ? `<g transform="translate(0 -104) scale(1.25)">${ACC_ART.crown}</g>`
             : has('hat')   ? `<g transform="translate(0 -103) scale(1.25)">${ACC_ART.hat}</g>` : '';
  // Чем старше стадия, тем наряднее: шарфик у 5-й стадии, плащ у «Чемпиона», фиолетовый плащ и сияние у «Короля»
  const cape = stageIdx >= 5
    ? `<path d="M-30-100Q-62-104-78-58-88-22-74 4H74Q88-22 78-58 62-104 30-100z" fill="${stageIdx >= 6 ? '#8E5CC8' : '#4FB3E3'}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`
    : '';
  const scarf = stageIdx >= 4
    ? `<path d="M12-24l10 24 11-5-9-22" fill="#EF5F57" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M-36-32Q0-14 36-32l1 9Q0-4-37-23z" fill="#EF5F57" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`
    : '';
  const sparkles = stageIdx >= 6
    ? [[28,40,1],[170,62,.8],[40,120,.7],[160,22,.6]].map(([x,y,k])=>`<path d="M${x} ${y-12*k}l${3*k} ${9*k} ${9*k} ${3*k}-${9*k} ${3*k}-${3*k} ${9*k}-${3*k}-${9*k}-${9*k}-${3*k} ${9*k}-${3*k}z" fill="#FCD535" stroke="${INK}" stroke-width="2" class="pet-sparkle"/>`).join('')
    : '';
  const body = `
    ${cape}
    ${petBody(species, stageIdx, !!head)}
    ${scarf}
    ${has('medal') ? `<g transform="translate(0 -22) scale(.9)">${ACC_ART.medal}</g>` : ''}
    ${has('glasses') ? `<g transform="translate(0 -70) scale(1.6)">${ACC_ART.glasses}</g>` : ''}
    ${has('bow') ? `<g transform="translate(36 -96) rotate(20) scale(.85)">${ACC_ART.bow}</g>` : ''}
    ${head}`;
  // Птенчик ещё сидит в скорлупке, орлёнок — в гнезде
  const front = stageIdx !== 1 ? ''
    : species === 'chick' ? `<path d="M-46-30l12-12 12 12 12-12 12 12 12-12 12 12 12-12 8 12C46-6 26 4 0 4S-46-6-46-30z" transform="translate(100 172) scale(1.05)" fill="#FFF3D6" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`
    : species === 'eagle' ? `<g transform="translate(100 168) scale(1.05)">${NEST}</g>` : '';
  return `<svg viewBox="0 0 200 190" class="pet-svg" aria-label="${label}">${shadow}${sparkles}${trophy}
    <g transform="translate(100 170) scale(${s})"><g class="pet-bob">${body}</g></g>${front}</svg>`;
}

/* ---- Друг говорит по-английски: только слова, которые ребёнок уже начал учить ---- */
// [фраза, перевод, с какой стадии, только для этого друга]
const FRIEND_PHRASES = [
  ['Hello!', 'Привет!', 1], ['Goodbye!', 'Пока!', 1], ['Yes!', 'Да!', 1], ['Good!', 'Хорошо!', 1],
  ['Thank you!', 'Спасибо!', 2], ['Good morning!', 'Доброе утро!', 2], ['Good night!', 'Спокойной ночи!', 2],
  ['I am happy!', 'Я счастлив!', 2], ['Look at me!', 'Посмотри на меня!', 2], ['Well done!', 'Молодец!', 2],
  ['I love you!', 'Я тебя люблю!', 3], ['Play with me!', 'Поиграй со мной!', 3], ['You are my friend!', 'Ты мой друг!', 3],
  ['I can jump!', 'Я умею прыгать!', 3], ['I can run!', 'Я умею бегать!', 3, 'fox'], ['I can fly!', 'Я умею летать!', 3, 'eagle'],
  ['I like apples!', 'Я люблю яблоки!', 3], ['I like school!', 'Я люблю школу!', 3],
  ['I am big now!', 'Я теперь большой!', 4], ['You are a star!', 'Ты звезда!', 4],
  ['I like books!', 'Я люблю книги!', 4], ['I like new words!', 'Я люблю новые слова!', 4],
  ['Have a good day!', 'Хорошего дня!', 5], ['I am the king of the forest!', 'Я король леса!', 6, 'fox'],
  ['I am the king of the mountains!', 'Я король гор!', 6, 'eagle'], ['I am the king of words!', 'Я король слов!', 6, 'chick'],
];
function learnedTokens(){
  const set = new Set();
  Object.values(WORD_BY_ID).forEach(w=>{ if((appState.progress[w.id] || 0) > 0) w.en.toLowerCase().split(/[\s-]+/).forEach(t=>set.add(t)); });
  STATIONS.forEach(st=>{ if((appState.progress['g_' + st.id] || 0) > 0) (st.spec.explains || []).forEach(t=>set.add(t.toLowerCase())); });
  return set;
}
function phraseKnown(en, known){
  return en.toLowerCase().replace(/[!?.,]/g, '').split(/\s+/).every(t=>known.has(t) || (t.endsWith('s') && known.has(t.slice(0, -1))) || (t === "let's" && known.has('let')));
}
// Что скажет друг: фраза из выученных слов, а если таких нет — одно выученное слово
let lastSaid = '';
function friendLine(info){
  if(info.idx === 0) return null; // яйцо и спящий клубочек молчат
  const known = learnedTokens();
  const phrases = FRIEND_PHRASES.filter(([en, , st, sp])=>st <= info.idx && (!sp || sp === info.friend.species) && phraseKnown(en, known))
    .map(([en, ru])=>({ en, ru }));
  const words = Object.values(WORD_BY_ID).filter(w=>(appState.progress[w.id] || 0) > 0).map(w=>({ en: w.en, ru: w.ru }));
  // Взрослый друг чаще говорит фразами, малыш — словами
  const pool = phrases.length && (Math.random() < .35 + info.idx * .1 || !words.length) ? phrases : words;
  const options = pool.filter(p=>p.en !== lastSaid);
  const pick = (options.length ? options : pool)[Math.floor(Math.random() * (options.length ? options : pool).length)];
  if(pick) lastSaid = pick.en;
  return pick || null;
}
function petTap(talk = true){
  const svg = document.querySelector('.pet-scene .pet-svg');
  const scene = document.querySelector('.pet-scene');
  if(!svg || !scene) return;
  if(talk){
    const line = friendLine(friendsState().show);
    scene.querySelectorAll('.pet-bubble').forEach(b=>b.remove());
    if(line){
      const b = document.createElement('div');
      b.className = 'pet-bubble';
      b.innerHTML = `<div class="pet-bubble-en">${esc(line.en)}</div><div class="pet-bubble-ru">${esc(line.ru)}</div>`;
      scene.appendChild(b);
      setTimeout(()=>b.remove(), 3200);
      setTimeout(()=>speak(line.en), 250);
    }
  }
  svg.classList.remove('happy'); void svg.getBoundingClientRect(); svg.classList.add('happy');
  playTone(880, 0.08); setTimeout(()=>playTone(1175, 0.1), 90);
  vibrate(15);
  for(let i=0; i<3; i++){
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.innerHTML = icon('heart', 22 + Math.random()*10);
    h.style.left = (40 + Math.random()*20) + '%';
    h.style.top = (30 + Math.random()*15) + '%';
    h.style.animationDelay = (i*0.12) + 's';
    scene.appendChild(h);
    setTimeout(()=>h.remove(), 1500);
  }
}

// Родитель задаёт награду и сколько звёзд собрать; считаем звёзды, полученные после постановки цели
function goalProgress(){
  const g = appState.goal;
  if(!g) return null;
  const got = Math.max(0, Math.min(g.target, totalStarsEarned() - g.start));
  return { got, target: g.target, pct: Math.round(got / g.target * 100), reached: got >= g.target };
}
function goalPillHtml(slim){
  const gp = goalProgress();
  if(!gp) return '';
  return `
    <div class="goal-pill ${slim ? 'slim' : ''} ${gp.reached ? 'done' : ''}">
      <img src="assets/images/gift.svg" alt="" width="42" height="42" onerror="this.remove()">
      <div class="goal-main">
        <div class="goal-text">${gp.reached ? 'Цель достигнута! Покажи родителям' : esc(appState.goal.text)}</div>
        <div class="goal-bar"><div class="goal-bar-fill" style="width:${gp.pct}%"></div></div>
      </div>
      <div class="goal-num">${gp.reached ? icon('check', 24) : `${icon('star', 16)} ${gp.got}/${gp.target}`}</div>
    </div>`;
}
const GOAL_SIZES = [50, 100, 200, 300, 500];
let goalDraft = { text: '', target: 100 };
function goalCardHtml(){
  const g = appState.goal;
  if(g){
    const gp = goalProgress();
    return `
      <div class="dash-card">
        <div class="goal-reward">${icon('star', 18)} Награда: <b>${esc(g.text)}</b></div>

        <p class="dash-empty">${gp.reached ? 'Цель достигнута — пора вручать награду!' : `Осталось собрать ${g.target - gp.got} звёзд. Ребёнок видит цель на тропе и у друга.`}</p>
        <button class="btn btn-outline" onclick="clearGoal()">${gp.reached ? 'Поставить новую цель' : 'Убрать цель'}</button>

  return `

}

// Какой встреченный друг подрос с прошлого раза (null — никто)
function grownFriend(){
  const infos = FRIENDS.map(friendInfo).filter(i=>i.met);
  if(!appState.friendStages){
    // Первый запуск этой версии: запоминаем, как есть, без поздравлений
    appState.friendStages = {};
    infos.forEach(i=>{ appState.friendStages[i.friend.level] = i.idx; });
    saveState();
    return null;
  }
  // Друга нового уровня сначала знакомим — его рост считаем с этого момента
  return infos.find(i=>appState.friendsSeen.includes(i.friend.level) && i.idx > (appState.friendStages[i.friend.level] ?? i.idx)) || null;
}
function grownPopupHtml(i){
  const from = appState.friendStages[i.friend.level];
  const first = from === 0;
  const verb = !first ? 'подрос' : i.friend.species === 'fox' ? 'проснулся' : 'вылупился';
  return `
    <div class="pop-layer" role="dialog" aria-label="Друг вырос ${i.friend.level}-${i.idx}">
      <div class="pop-card">
        <div class="pop-title">${i.friend.title} ${verb}!</div>
        <div class="grow-row">
          <div class="grow-old">${petSvg(from, [], i.friend.species)}</div>
          <div class="grow-arrow">${icon('star', 30)}</div>
          <div class="grow-new">${petSvg(i.idx, [], i.friend.species)}</div>
        </div>
        <div class="pop-reward">${i.name}</div>
        <div class="pop-text">${i.next ? `До стадии «${i.next.name}» — ещё ${i.next.min - i.stars} звёзд.` : 'Это самая большая стадия. Ты молодец!'}</div>
        <button class="btn btn-primary" onclick="closeGrownPopup(${i.friend.level}, ${i.idx})">Ура!</button>
      </div>
    </div>`;
}
function closeGrownPopup(level, idx){
  appState.friendStages[level] = idx;
  appState.petShow = level;
  saveState(); soundClick();
  goTo('pet');
  setTimeout(petTap, 500);
}
function closeFriendPopup(lv){
  if(lv > 1) track('уровень ' + lv);
  if(appState.friendStages) FRIENDS.forEach(f=>{ if(f.level <= lv && appState.friendStages[f.level] === undefined) appState.friendStages[f.level] = friendInfo(f).idx; });
  // Отмечаем и все прошлые уровни — если ребёнок перепрыгнул через уровень, второе окно не нужно
  FRIENDS.forEach(f=>{ if(f.level <= lv && !appState.friendsSeen.includes(f.level)) appState.friendsSeen.push(f.level); });
  appState.petShow = null;
  saveState(); soundClick(); render();
}

/* ============================= PARENT GATE ============================= */
let gateQuestion = null;
function parentTop(title){
  return `
    <div class="parent-top">
      <button class="round-btn" onclick="goTo('map')" aria-label="Закрыть">${icon('close',26)}</button>
      <div class="parent-title">${title}</div>
      <span style="width:48px;"></span>
    </div>`;
}
function renderParentGate(){
  // Умножение 6–9 × 6–9: дошкольнику не по силам, взрослому — пара секунд
  const a = Math.floor(Math.random()*4)+6;
  const b = Math.floor(Math.random()*4)+6;
  const correct = a*b;
  gateQuestion = {a, b, correct};
  const opts = [correct];
  for(const d of shuffle([-a, a, -b, b, 1, -1, 10, -10])){
    if(opts.length >= 3) break;
    if(!opts.includes(correct+d)) opts.push(correct+d);
  }
  return `
    ${parentTop('Для родителей')}
    <div class="gate-card" id="gateCard">
      <div class="gate-lock">${icon('lock',68)}</div>
      <p class="gate-text">Решите пример, чтобы войти.<br>Так мы проверяем, что это взрослый.</p>
      <div class="gate-q">${a} × ${b} = ?</div>
      <div class="gate-options">${shuffle(opts).map(o=>`<button class="gate-opt" onclick="checkGate(${o})">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
}
function checkGate(val){
  soundClick();
  if(val === gateQuestion.correct){ screen = 'parentDashboard'; render(); return; }
  const fb = document.getElementById('fb');
  fb.textContent = 'Неверно, вот другой пример'; fb.className = 'feedback bad';
  document.getElementById('gateCard').classList.add('nope');
  setTimeout(()=>{ if(screen === 'parentGate') render(); }, 900);
}

/* ============================= PARENT DASHBOARD ============================= */
function segmented(key, options){
  return `<div class="seg" role="group">${options.map(([val, label])=>
    `<button class="${appState.settings[key] === val ? 'on' : ''}" aria-pressed="${appState.settings[key] === val}" onclick="setSetting('${key}', ${JSON.stringify(val).replace(/"/g, '&quot;')})">${label}</button>`
  ).join('')}</div>`;
}
function renderParentDashboard(){
  const total = totalStarsEarned();
  const wordsLearned = Object.entries(appState.progress).filter(([id, s])=>!id.startsWith('g_') && s>=3).length;
  const totalWords = SECTIONS.reduce((a,s)=>a+s.lessons.reduce((b,l)=>b+l.words.length,0),0);
  const imgIcon = id => `<img src="assets/images/${id}.svg" alt="" width="36" height="36" onerror="this.remove()">`;

  const topicRows = SECTIONS.map(s=>{
    const pct = Math.round(sectionStars(s)/maxStarsForSection(s)*100);
    return `
      <div class="topic-row">
        <div class="topic-pic">${wImg(sectionPicWord(s), 30)}</div>
        <div class="topic-main">
          <div class="topic-bar-name"><span>${s.title}</span><span>${pct}%</span></div>
          <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${pct}%; background:${s.color};"></div></div>
        </div>
      </div>`;
  }).join('');

  const allWordsFlat = SECTIONS.flatMap(s=>s.lessons.flatMap(l=>l.words.map(w=>({...w, stars: appState.progress[w.id]||0}))));
  const struggling = allWordsFlat.filter(w=>w.stars>0 && w.stars<3).sort((a,b)=>a.stars-b.stars).slice(0,6);
  const struggleHtml = struggling.length
    ? struggling.map(w=>`
        <div class="struggle-word">
          ${wImg(w,34)}
          <div class="sw-text"><div class="sw-en">${w.en}</div><div class="sw-ru">${w.ru}</div></div>
          <div class="sw-stars">${starsRow(w.stars, 18)}</div>
          <button class="speak-btn small" onclick="speak(${jsq(w.en)})" aria-label="Послушать ${w.en}">${icon('speaker',20)}</button>
        </div>`).join('')
    : '<p class="dash-empty">Пока рано говорить о трудных словах — ребёнок только начал.</p>';

  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const dayPills = dayNames.map(d=>`<button class="day-pill ${appState.settings.reminderDays.includes(d)?'on':''}" aria-pressed="${appState.settings.reminderDays.includes(d)}" onclick="toggleDay('${d}')">${d}</button>`).join('');

  return `
    ${parentTop('Родителям')}
    <div class="stat-grid">
      <div class="stat"><div class="stat-icon">${imgIcon('school_1_book')}</div><div><div class="stat-val">${wordsLearned}<small> / ${totalWords}</small></div><div class="stat-label">слов выучено</div></div></div>
      <div class="stat"><div class="stat-icon">${icon('star',36)}</div><div><div class="stat-val">${total}</div><div class="stat-label">звёзд собрано</div></div></div>
      <div class="stat"><div class="stat-icon">${icon('flame',36)}</div><div><div class="stat-val">${currentStreak()}</div><div class="stat-label">дней подряд</div></div></div>
      <div class="stat"><div class="stat-icon">${imgIcon('nature_2_snow')}</div><div><div class="stat-val">${appState.streak.freezeAvailable ? 'есть' : 'нет'}</div><div class="stat-label">заморозка серии</div></div></div>
    </div>

    <div class="section-label">Прогресс по темам</div>
    <div class="dash-card">${topicRows}</div>

    <div class="section-label">Слова, которые даются труднее</div>
    <div class="dash-card">${struggleHtml}</div>

    <div class="section-label">Установить на телефон</div>
    ${installCardHtml()}

    <div class="section-label">Цель и награда</div>
    ${goalCardHtml()}

    <div class="section-label">Настройки</div>
    <div class="dash-card">
      <div class="setting-row stack">
        <span class="setting-label">Голос озвучки</span>
        ${segmented('voice', [['US','Американский'],['UK','Британский']])}
      </div>
      <div class="setting-row stack">
        <span class="setting-label">Лимит времени в день</span>
        ${segmented('timeLimit', [[15,'15 мин'],[30,'30 мин'],[45,'45 мин'],[60,'60 мин']])}
      </div>
      <div class="setting-row">
        <span class="setting-label">Звуки</span>
        <label class="switch"><input type="checkbox" ${appState.settings.soundOn?'checked':''} onchange="toggleSound(this.checked)" aria-label="Звуки"><span></span></label>
      </div>
      <div class="setting-row stack">
        <span class="setting-label">Дни напоминаний</span>
        <div class="day-pills">${dayPills}</div>
      </div>
    </div>

    <div class="section-label">Для проверки</div>
    <div class="dash-card">
      <div class="setting-row">
        <span class="setting-label">Открыть все уроки и станции</span>
        <label class="switch"><input type="checkbox" ${appState.settings.unlockAll ? 'checked' : ''} onchange="setUnlockAll(this.checked)" aria-label="Открыть все уроки"><span></span></label>
      </div>
      <p class="dash-empty">В курсе ${LEVELS.length} уровня, ${SECTIONS.length} тем, ${STATIONS.length} станций и ${Object.keys(WORD_BY_ID).length} слов.</p>
      ${stationCheckHtml()}
    </div>

    ${supportCardHtml()}

    <details class="dash-details">
      <summary>Приватность и данные</summary>
      <p>Весь прогресс ребёнка хранится только в этом браузере (localStorage) и никуда не отправляется. Для статистики мы считаем анонимно, сколько раз открывают приложение и проходят уроки (сервис GoatCounter, без cookies и без личных данных). В будущей версии:</p>
      <p>• Данные будут храниться на серверах в РФ (требование 152-ФЗ для пользователей из России)<br>
      • Про ребёнка собираем только никнейм и аватар — без фамилии, даты рождения, фото<br>
      • Родитель сможет удалить аккаунт и все данные прямо из приложения<br>
      • Без рекламы и поведенческого трекинга (требование App Store Kids Category и Google Play Families)</p>
    </details>
    <details class="dash-details">
      <summary>Авторы картинок</summary>
      <p>Картинки: <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a> — открытый проект эмодзи и иконок. Лицензия: CC BY-SA 4.0</p>
    </details>
  `;
}
function toggleDay(d){
  soundClick();
  const arr = appState.settings.reminderDays;
  const i = arr.indexOf(d);
  if(i>-1) arr.splice(i,1); else arr.push(d);
  saveState(); render();
}
function setSetting(key, val){
  soundClick();
  appState.settings[key] = val;
  saveState(); render();
}
function setUnlockAll(on){
  appState.settings.unlockAll = on;
  saveState();
  soundClick();
}
function toggleSound(on){
  appState.settings.soundOn = on;
  saveState();
  if(on) soundCorrect();
}

/* ============================= ПОДДЕРЖАТЬ ПРОЕКТ ============================= */
// Страницы пожертвований: кнопка показывается, только если у неё есть ссылка; нет ни одной — нет и карточки.
// Если ссылка одна, кнопка называется просто «Поддержать проект».
// Карточка живёт только в разделе «Родителям» (за проверкой-вопросом), чтобы дети не нажимали на неё.
const SUPPORT_LINKS = [
  { label: 'Из России',        note: 'карта или СБП',            url: '' },
  { label: 'Из других стран',  note: 'карты банков других стран', url: 'https://boosty.to/englishkids/donate' },
];
// Криптокошелёк: показываем адрес, QR-код (icons/crypto-qr.svg — проверен сканером) и кнопку «Скопировать».
// Пустой address — кнопки нет.
const SUPPORT_CRYPTO = {
  address: '0x5dada8c724dA1c469B7Ec8f9530ebaB35DB08051',
  network: 'BNB Smart Chain (BEP-20)',
  coins: 'USDT, USDC или BNB',
  qr: 'icons/crypto-qr.svg',
};
function supportCardHtml(){
  const links = SUPPORT_LINKS.filter(l=>l.url);
  const crypto = SUPPORT_CRYPTO.address ? `
      <button class="btn btn-outline support-btn" onclick="openCrypto()">
        <span class="support-btn-main">${icon('coin', 22)} Криптовалютой</span>
        <span class="support-btn-note">${SUPPORT_CRYPTO.coins} · сеть BNB Smart Chain</span>
      </button>` : '';
  if(!links.length && !crypto) return '';
  const buttons = links.map((l, i)=>`
      <a class="btn ${i === 0 ? 'btn-berry' : 'btn-outline'} support-btn" href="${l.url}" target="_blank" rel="noopener" onclick="track('поддержать: переход', ${jsq(l.label)})">
        <span class="support-btn-main">${icon('heart', 22)} ${links.length > 1 ? l.label : 'Поддержать проект'}</span>
        ${links.length > 1 ? `<span class="support-btn-note">${l.note}</span>` : ''}
      </a>`).join('');
  return `
    <div class="dash-card support-card">
      <div class="support-head">${icon('heart', 34)}<div class="support-title">Нравится приложение?</div></div>
      <p class="support-text">Его делает один человек, без рекламы и платных подписок. Если приложение помогает вашему ребёнку, можно поддержать проект — это поможет добавить озвучку, новые уроки и игры.</p>
      ${buttons}${crypto}
    </div>`;
}
function openCrypto(){
  soundClick();
  track('поддержать: криптовалюта');
  const c = SUPPORT_CRYPTO;
  const layer = document.createElement('div');
  layer.className = 'pop-layer crypto-layer';
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-label', 'Поддержать криптовалютой');
  layer.onclick = e => { if(e.target === layer) closeCrypto(); };
  layer.innerHTML = `
    <div class="pop-card crypto-card">
      <div class="pop-title">Криптовалютой</div>
      <div class="crypto-net">${c.coins}<br>сеть <b>${c.network}</b></div>
      <img class="crypto-qr" src="${c.qr}" alt="QR-код адреса кошелька">
      <div class="crypto-addr">${c.address}</div>
      <button class="btn btn-primary" onclick="copyCrypto(this)">Скопировать адрес</button>
      <p class="crypto-warn">Отправляйте только в сети ${c.network}. Перевод из другой сети может потеряться.</p>
      <button class="btn btn-ghost" onclick="closeCrypto()">Закрыть</button>
    </div>`;
  document.getElementById('app').appendChild(layer);
}
function closeCrypto(){ document.querySelectorAll('.crypto-layer').forEach(l=>l.remove()); }
function copyCrypto(btn){
  const done = () => { btn.textContent = 'Адрес скопирован ✓'; soundCorrect(); };
  // Если копирование запрещено (старый браузер), выделяем адрес — его можно скопировать вручную
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.querySelector('.crypto-addr')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Адрес выделен — скопируйте его'; };
  if(navigator.clipboard) navigator.clipboard.writeText(SUPPORT_CRYPTO.address).then(done, fallback); else fallback();
}

/* ============================= СТАТИСТИКА ============================= */
// GoatCounter: считает открытия и события анонимно — без cookies, без имени, почты и прогресса ребёнка.
// STATS_CODE — имя счётчика на goatcounter.com (например 'englishkids'). Пусто — статистика выключена.
// На своём компьютере (localhost, файл) не считаем, чтобы проверки не портили цифры.
const STATS_CODE = 'englishkids';
const statsOn = !!STATS_CODE && location.protocol === 'https:';
if(statsOn){
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${STATS_CODE}.goatcounter.com/count`;
  document.head.appendChild(s);
}
// Событие: name — что случилось (в отчёте это строка), title — подробность
function track(name, title){
  if(!statsOn) return;
  const send = () => { if(window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: title || name, event: true }); };
  if(window.goatcounter && window.goatcounter.count) send(); else setTimeout(send, 3000);
}
if(isStandaloneLaunch()) track('запуск из значка');
function isStandaloneLaunch(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

/* ============================= УСТАНОВКА НА ТЕЛЕФОН ============================= */
// Android (Chrome) сам предлагает установку — ловим это событие и показываем кнопку у родителей.
// На iPhone кнопки установки нет — показываем, где она в Safari.
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPrompt = e; if(screen === 'parentDashboard') render(); });
window.addEventListener('appinstalled', ()=>{ track('приложение установлено'); installPrompt = null; if(screen === 'parentDashboard') render(); });
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installCardHtml(){
  const card = body => `<div class="dash-card install-card">${body}</div>`;
  if(isStandalone()) return card(`<p class="dash-empty">${icon('check',16)} Приложение установлено и работает без интернета.</p>`);
  if(location.protocol === 'file:') return card('<p class="dash-empty">Установить можно с сайта: откройте приложение по ссылке в браузере телефона.</p>');
  const why = '<p class="install-why">Значок на главном экране, запуск во весь экран, работает без интернета.</p>';
  if(installPrompt) return card(`${why}<button class="btn btn-primary" onclick="installApp()">Установить на телефон</button>`);
  if(isIOS()) return card(`${why}<ol class="install-steps">
      <li>Откройте эту страницу в <b>Safari</b>.</li>
      <li>Нажмите <b>«Поделиться»</b> — квадрат со стрелкой вверх.</li>
      <li>Выберите <b>«На экран „Домой“»</b> и нажмите <b>«Добавить»</b>.</li>
    </ol>`);
  return card(`${why}<ol class="install-steps">
      <li>Откройте меню браузера — <b>⋮</b> вверху справа.</li>
      <li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.</li>
    </ol>`);
}
async function installApp(){
  if(!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  render();
}
// Работа без интернета (sw.js). После запуска докачиваем в фоне все картинки курса.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(reg=>{
      const ids = new Set([...DECOR, 'gift', 'school_1_book', 'nature_2_snow', 'nature_3_tree', 'nature_3_flower', 'fruits_veg_5_mushroom']);
      Object.values(WORD_BY_ID).forEach(w=>{ if(w.emoji) ids.add(w.id); });
      const urls = [...ids].map(id=>new URL(`assets/images/${id}.svg`, location.href).href);
      if(reg.active) reg.active.postMessage({ type: 'precache', urls });
    }).catch(err=>console.warn('Без офлайн-режима:', err));
  });
}

/* ============================= СТАРТ ============================= */
stationProblems().forEach(p=>console.warn(`Станция «${p.station}»: неизученные слова — ${p.words.join(', ')}`));
render();
</script>
