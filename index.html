<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnglishKids — учим слова играя</title>
<!-- Установка на телефон: значок, имя, цвет шапки -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5DB043">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EnglishKids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Тема «Сказочный лес»: тёплые цвета, мягкие объёмные формы ===== */
:root{
  --bg:#FFF6E6; --paper:#FFFDF8; --card:#FFFDF8;
  --ink:#3B2A1A; --ink-soft:#7A6248; --muted:#A38B6D; --line:#EFDFC4; --line-dark:#DCC6A2;
  --leaf:#5DB043; --leaf-dark:#3F8A2A; --leaf-shadow:#3D7F27; --leaf-light:#E4F4D6;
  --sun:#FFC83D; --sun-shadow:#D99A12;
  --berry:#EF5F57; --berry-shadow:#C43F38; --berry-light:#FDE3E0;
  --sky:#4FB3E3; --sky-shadow:#2F8FBF; --sky-light:#E1F3FB;
  --wood:#B97E4B; --wood-dark:#8A5A32;
  /* старые имена — ими пользуются экраны питомца, родителей и финала */
  --primary:var(--leaf); --primary-dark:var(--leaf-dark); --primary-shadow:var(--leaf-shadow);
  --blue:var(--sky); --blue-shadow:var(--sky-shadow); --red:var(--berry); --red-shadow:var(--berry-shadow);
  --yellow:var(--sun); --yellow-shadow:var(--sun-shadow); --purple:#B98AE0; --purple-shadow:#9168B8;
  --gray-text:var(--ink); --gray-muted:var(--muted); --border:var(--line);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:'Nunito','Trebuchet MS',sans-serif; color:var(--ink);
  background-color:#B5DE98;
  background-image:radial-gradient(circle at 15% 12%, #E6F6CF 0, transparent 38%), radial-gradient(circle at 85% 90%, #8CC870 0, transparent 45%), linear-gradient(180deg,#CDEBB4,#98CF7E);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
}
.app{
  width:100%; max-width:440px; height:calc(100vh - 32px); height:calc(100dvh - 32px); max-height:880px;
  background:var(--bg); border-radius:36px; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 30px 60px rgba(40,70,20,.28), 0 0 0 8px rgba(255,255,255,.35);
}
@media (max-width:520px){
  body{padding:0;}
  .app{max-width:none; height:100vh; height:100dvh; max-height:none; border-radius:0; box-shadow:none;}
}
.screen{flex:1; overflow-y:auto; padding:18px 16px 16px; background:var(--bg); position:relative;}
.screen::-webkit-scrollbar{width:0;}
.screen-map{padding-top:0;}
.screen-lesson{display:flex; flex-direction:column; padding:14px 18px 18px;}

/* ===== Кнопки ===== */
.btn{
  border:none; border-radius:20px; padding:16px 18px; font-family:inherit; font-size:19px; font-weight:900;
  cursor:pointer; width:100%; margin-top:10px; position:relative; top:0; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:top .08s, box-shadow .08s;
}
.btn:active{top:4px;}
.btn-primary{background:var(--leaf); color:#fff; box-shadow:0 5px 0 var(--leaf-shadow);}
.btn-primary:active{box-shadow:0 1px 0 var(--leaf-shadow);}
.btn-berry{background:var(--berry); color:#fff; box-shadow:0 5px 0 var(--berry-shadow);}
.btn-berry:active{box-shadow:0 1px 0 var(--berry-shadow);}
.btn-blue{background:var(--sky); color:#fff; box-shadow:0 5px 0 var(--sky-shadow);}
.btn-blue:active{box-shadow:0 1px 0 var(--sky-shadow);}
.btn-outline{background:var(--paper); border:2px solid var(--line); color:var(--ink-soft); box-shadow:0 5px 0 var(--line);}
.btn-outline:active{box-shadow:0 1px 0 var(--line);}
.btn-ghost{background:transparent; color:var(--muted); box-shadow:none; font-size:13px; font-weight:800;}
.btn-ghost:active{top:0;}
.btn:disabled, .btn.btn-disabled{background:#EADBC2 !important; color:#B8A386 !important; box-shadow:0 5px 0 #D9C6A5 !important; cursor:default;}
.btn:disabled:active{top:0;}
.btn.grow{flex:1;}
.btn-label{position:relative; display:inline-flex; align-items:center; gap:8px;}
.btn-next .charge{position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(93,176,67,.4);}
.btn-next.charging .charge{animation:charge 2s linear forwards;}
@keyframes charge{to{width:100%;}}
.round-btn{
  width:48px; height:48px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; background:transparent; color:var(--muted); position:relative; top:0;
}
.round-btn.soft{width:62px; height:62px; background:var(--paper); border:2px solid var(--line); box-shadow:0 5px 0 var(--line); color:var(--ink-soft);}
.round-btn.soft:active{top:4px; box-shadow:0 1px 0 var(--line);}
.speak-btn{
  background:var(--sky); color:#fff; border:none; border-radius:50%; width:76px; height:76px; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 var(--sky-shadow); position:relative; top:0;
}
.speak-btn:active{top:4px; box-shadow:0 1px 0 var(--sky-shadow);}
.speak-btn.small{width:42px; height:42px; box-shadow:0 3px 0 var(--sky-shadow);}

/* ===== Карта: лесная тропа ===== */
.map-top{
  position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
  margin:0 -16px 12px; padding:12px 16px; background:rgba(255,246,230,.94); border-bottom:2px solid var(--line);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.map-top-title{font-size:19px; font-weight:900; color:var(--leaf-dark);}
.chip{display:flex; align-items:center; gap:5px; background:var(--paper); border:2px solid var(--line); border-radius:100px; padding:3px 12px 3px 5px; font-weight:900; font-size:18px; box-shadow:0 3px 0 var(--line);}
.glade{position:relative; border-radius:34px; margin-bottom:16px; padding-top:14px; background:linear-gradient(180deg, var(--tint) 0%, transparent 90%);}
.glade-sign{
  position:relative; z-index:3; display:flex; align-items:center; gap:10px; margin:0 auto; width:fit-content; max-width:92%;
  padding:7px 18px 7px 7px; border-radius:18px; color:#FFF6E3;
  background:linear-gradient(180deg,#C98F58,#B07A47); border:3px solid var(--wood-dark); box-shadow:0 5px 0 #6E4524;
}
.sign-pic{width:48px; height:48px; border-radius:14px; background:#FFF6E3; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sign-title{font-size:19px; font-weight:900; line-height:1.1; text-shadow:0 2px 0 rgba(0,0,0,.18);}
.sign-meta{display:flex; align-items:center; gap:4px; font-size:13px; font-weight:800; margin-top:2px;}
.trail{position:relative;}
.trail-path{position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; overflow:visible;}
.deco{position:absolute; z-index:1; transform:translate(-50%,-50%); pointer-events:none;}
.node{position:absolute; z-index:2; width:84px; height:84px; margin:-42px 0 0 -42px;}
.node-btn{
  width:84px; height:84px; border-radius:50%; border:none; padding:7px; cursor:pointer; position:relative; top:0;
  background:conic-gradient(var(--c) var(--p), #EADBC2 0); box-shadow:0 6px 0 rgba(110,69,36,.28); transition:top .08s, box-shadow .08s;
}
.node-btn:active{top:4px; box-shadow:0 2px 0 rgba(110,69,36,.28);}
.node-pic{width:100%; height:100%; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:inset 0 -4px 0 rgba(0,0,0,.06);}
.node.done .node-btn{background:linear-gradient(180deg,#FFD95A,#F2AE1F);}
.node.locked .node-btn{background:#E6D6BB; cursor:default; box-shadow:0 6px 0 rgba(110,69,36,.14);}
.node.locked .node-btn:active{top:0;}
.node.locked .node-pic{background:#F3E9D7;}
.node.locked .node-pic > *{filter:grayscale(1); opacity:.35;}
.node.nope .node-btn{animation:shake .35s;}
.node-badge{position:absolute; right:-6px; bottom:-4px; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--paper); border:2px solid var(--line-dark);}
.node-badge.ok{background:var(--leaf); border-color:var(--leaf-shadow);}
.node.current::before{content:''; position:absolute; inset:-12px; border-radius:50%; background:var(--c); animation:halo 1.8s ease-out infinite;}
.node.current .node-btn{animation:bob 2.2s ease-in-out infinite;}
.node-stars{position:absolute; top:-22px; left:50%; transform:translateX(-50%); display:flex; gap:0; z-index:3;}
.node-stars svg:nth-child(2){transform:translateY(-6px);}
.node-label{
  position:absolute; top:94px; left:50%; transform:translateX(-50%); width:max-content; max-width:150px; text-align:center;
  font-size:12px; line-height:1.2; font-weight:800; color:var(--ink-soft); background:rgba(255,253,248,.85); padding:2px 8px; border-radius:10px;
}
.node.locked .node-label{color:var(--muted);}
.node-worm{position:absolute; top:-16px; width:66px; height:72px; z-index:4; pointer-events:none; animation:bob 2.2s ease-in-out .3s infinite;}
.node-worm.left{right:100px;} .node-worm.right{left:100px;}
.node-worm svg{width:100%; height:100%; display:block;}
@keyframes halo{0%{transform:scale(.85); opacity:.35;} 100%{transform:scale(1.3); opacity:0;}}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}

.bottom-nav{display:flex; gap:6px; background:var(--paper); border-top:3px solid var(--line); padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
.nav-btn{flex:1; border:none; background:none; padding:6px 4px; display:flex; flex-direction:column; align-items:center; gap:1px; font-family:inherit; font-size:12px; font-weight:900; color:var(--muted); cursor:pointer; border-radius:16px;}
.nav-btn.active{background:var(--leaf-light); color:var(--leaf-dark);}

/* ===== Урок ===== */
.lesson-top{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.lprogress{flex:1; height:18px; border-radius:100px; background:#EADBC2; overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.06);}
.lprogress-fill{height:100%; min-width:18px; border-radius:100px; background:linear-gradient(180deg,#7CCB55,var(--leaf)); position:relative; transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.lprogress-fill::after{content:''; position:absolute; top:4px; left:8px; right:8px; height:4px; border-radius:4px; background:rgba(255,255,255,.45);}
.lesson-pic{width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.stage{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; min-height:0;}
.stage-actions{display:flex; gap:12px; align-items:center; padding-top:12px;}
.stage-actions .btn{margin-top:0;}
.stage-actions.spread{justify-content:space-between;}

.prompt{display:flex; flex-direction:column; align-items:center; gap:8px;}
.prompt-pic{width:180px; height:180px; border-radius:38px; background:var(--paper); border:3px solid var(--line); box-shadow:0 6px 0 var(--line); display:flex; align-items:center; justify-content:center; animation:pop-in .4s cubic-bezier(.34,1.56,.64,1);}
.prompt.compact .prompt-pic{width:136px; height:136px; border-radius:32px;}
.word-ru{font-size:28px; font-weight:900; color:var(--ink); text-align:center; line-height:1.15;}
.word-ru.small{font-size:19px; color:var(--ink-soft);}

.card-scene{perspective:1200px; width:100%; height:380px; max-height:56vh;}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.34,1.56,.64,1); cursor:pointer;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; border-radius:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:16px;}
.front{background:var(--paper); border:4px solid var(--line); box-shadow:0 8px 0 var(--line);}
.back{background:linear-gradient(180deg,#F1FAEA,#DDF1CF); border:4px solid #BFE3A8; box-shadow:0 8px 0 #BFE3A8; transform:rotateY(180deg);}
.word-en{font-size:46px; font-weight:900; color:var(--leaf-dark); line-height:1; word-break:break-word;}
.ipa{font-size:18px; color:var(--ink-soft); font-weight:700;}
.tap-hint{position:absolute; right:22px; bottom:20px; color:var(--sun-shadow); animation:tap 1.4s ease-in-out infinite;}
@keyframes tap{0%,100%{transform:scale(1); opacity:.9;} 50%{transform:scale(.75); opacity:.45;}}

.options{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;}
.opt-btn{font-family:inherit; background:var(--paper); border:3px solid var(--line); border-radius:22px; padding:20px 8px; font-size:22px; font-weight:900; color:var(--ink); cursor:pointer; box-shadow:0 5px 0 var(--line); position:relative; top:0; word-break:break-word;}
.opt-btn:active{top:3px; box-shadow:0 2px 0 var(--line);}
.opt-btn.correct{background:var(--leaf-light); border-color:var(--leaf); color:var(--leaf-dark); box-shadow:0 5px 0 var(--leaf);}
.opt-btn.wrong{background:var(--berry-light); border-color:var(--berry); color:var(--berry-shadow); box-shadow:0 5px 0 var(--berry); animation:shake .3s;}

.slots-row, .letters-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
.slot{width:44px; height:54px; border-radius:14px; background:#F3E7D2; border:2px dashed var(--line-dark); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:var(--ink);}
.slot.filled{background:var(--paper); border:2px solid var(--leaf); color:var(--leaf-dark); cursor:pointer; box-shadow:0 3px 0 var(--leaf);}
.slot.wrong-slot{background:var(--berry-light); border:2px solid var(--berry); color:var(--berry-shadow); box-shadow:0 3px 0 var(--berry); animation:shake .3s;}
.slot.space-sep{width:14px; border:none; background:transparent;}
.letter-tile{width:52px; height:56px; border-radius:16px; background:linear-gradient(180deg,#FBE3B5,#F5CF8E); border:2px solid #D9A866; color:var(--ink); font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 5px 0 #C89255; user-select:none; position:relative; top:0;}
.letter-tile:active{top:4px; box-shadow:0 1px 0 #C89255;}
.letter-tile.used{visibility:hidden;}
.letter-tile.pop-in{animation:pop-in .35s cubic-bezier(.34,1.56,.64,1) both;}
.many .slots-row{flex-wrap:nowrap; gap:4px; width:100%;}
.many .slot{flex:1 1 0; min-width:0; max-width:34px; height:46px; font-size:21px; border-radius:11px;}
.many .slot.space-sep{flex:0 0 8px;}
.many .letter-tile{width:42px; height:48px; font-size:22px; border-radius:13px;}

.cells-row{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.cell-input{width:44px; height:54px; padding:0; text-align:center; font-family:inherit; font-size:26px; font-weight:900; border:3px solid var(--line); border-radius:14px; outline:none; background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--line); text-transform:lowercase;}
.cell-input:focus{border-color:var(--sky); background:var(--sky-light);}
.cell-input.wrong{border-color:var(--berry); background:var(--berry-light); animation:shake .3s;}
.cell-input.correct{border-color:var(--leaf); background:var(--leaf-light); color:var(--leaf-dark);}
.cells-row.many{flex-wrap:nowrap; gap:4px; width:100%;}
.cells-row.many .cell-input{flex:1 1 0; min-width:0; max-width:34px; height:46px; font-size:21px; border-width:2px;}
.cell-sep{width:12px;}
.hearts{display:flex; gap:4px; justify-content:center;}
.listen-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
.listen-btn{width:140px; height:140px; border-radius:50%; border:none; background:var(--sky); color:#fff; box-shadow:0 8px 0 var(--sky-shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; top:0;}
.listen-btn:active{top:5px; box-shadow:0 3px 0 var(--sky-shadow);}
.listen-btn::before{content:''; position:absolute; inset:-12px; border-radius:50%; border:5px solid var(--sky); animation:halo 1.8s ease-out infinite;}
.feedback{text-align:center; font-size:16px; font-weight:800; min-height:22px;}
.feedback.ok{color:var(--leaf-dark);} .feedback.bad{color:var(--berry-shadow);}

/* Панель «Верно / Почти» */
.sheet-layer{position:absolute; inset:0; z-index:60; display:flex; align-items:flex-end; background:rgba(59,42,26,0); transition:background .25s;}
.sheet-layer.show{background:rgba(59,42,26,.14);}
.sheet{width:100%; padding:16px 18px 22px; border-radius:30px 30px 0 0; transform:translateY(105%); transition:transform .35s cubic-bezier(.34,1.3,.64,1);}
.sheet-layer.show .sheet{transform:none;}
.sheet.ok{background:#E4F4D6; border-top:4px solid #BFE3A8;}
.sheet.bad{background:#FDE3E0; border-top:4px solid #F6B9B3;}
.sheet-row{display:flex; align-items:center; gap:12px;}
.sheet-worm{width:78px; height:84px; flex-shrink:0;}
.sheet-worm svg{width:100%; height:100%; display:block;}
.sheet-title{font-size:26px; font-weight:900;}
.sheet.ok .sheet-title{color:var(--leaf-dark);} .sheet.bad .sheet-title{color:var(--berry-shadow);}
.sheet-word{display:flex; align-items:center; gap:10px; font-size:28px; font-weight:900; color:var(--ink); line-height:1.1;}
.sheet-ru{font-size:15px; font-weight:700; color:var(--ink-soft);}

/* ===== Общие элементы (питомец, родители, финал) ===== */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.stage-title{font-size:16px; font-weight:900; color:var(--ink);}
.exit-btn{background:none; border:none; font-size:24px; color:var(--muted); cursor:pointer; padding:4px; line-height:1;}
.emoji{animation:bounce-in .5s cubic-bezier(.34,1.56,.64,1);}

.section-label{font-size:12px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:18px 0 8px;}

.gate-box{text-align:center; padding:20px 0;}
.gate-q{font-size:34px; font-weight:900; color:var(--sky-shadow); margin:16px 0;}
.gate-options{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.gate-opt{font-family:inherit; background:var(--paper); border:2px solid var(--line); border-bottom:5px solid var(--line); border-radius:16px; padding:14px 0; font-size:20px; font-weight:900; color:var(--ink); cursor:pointer;}
.dash-card{background:var(--paper); border-radius:20px; padding:14px; margin-bottom:12px; border:2px solid var(--line);}
.dash-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.dash-row:last-child{margin-bottom:0;}
.dash-label{font-size:13px; color:var(--muted); font-weight:700;}
.dash-value{font-size:14px; font-weight:900; color:var(--ink);}
.topic-bar-row{margin-bottom:10px;}
.topic-bar-name{font-size:13px; font-weight:800; margin-bottom:4px; display:flex; justify-content:space-between;}
.topic-bar-track{background:#EFE3CE; border-radius:100px; height:10px; overflow:hidden;}
.topic-bar-fill{height:100%; background:var(--leaf); border-radius:100px; transition:width .5s;}
.struggle-word{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; font-weight:700;}
.struggle-word:last-child{border-bottom:none;}
.setting-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.setting-label{font-size:14px; font-weight:800; color:var(--ink);}
select{font-family:inherit; font-size:14px; border-radius:10px; border:2px solid var(--line); padding:6px 10px; font-weight:800; color:var(--ink); background:var(--paper);}
.day-pills{display:flex; gap:6px; flex-wrap:wrap;}
.day-pill{width:36px; height:36px; border-radius:50%; background:#F1E6D3; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--muted); cursor:pointer; border:2px solid transparent;}
.day-pill.on{background:var(--sky); color:#fff; border-color:var(--sky-shadow);}
.privacy-note{font-size:12px; color:var(--muted); line-height:1.5; background:#FBF1E0; padding:12px; border-radius:14px; font-weight:700;}

.confetti-piece{position:absolute; top:-10px; border-radius:2px; animation:confetti-fall linear forwards; z-index:50;}

/* ===== Питомец: лесная полянка ===== */
.screen-pet{padding-top:0;}
.pet-scene{
  position:relative; height:300px; border-radius:32px; overflow:hidden; cursor:pointer;
  background:linear-gradient(180deg,#BFE6FA 0%,#E4F5FC 55%,#FFF6E6 100%);
  border:3px solid #CFE7C0; box-shadow:0 6px 0 #CFE7C0;
}
.pet-sun{position:absolute; right:26px; top:22px; width:46px; height:46px; border-radius:50%; background:#FFD95A; box-shadow:0 0 0 10px rgba(255,217,90,.3);}
.pet-cloud{position:absolute; height:22px; border-radius:20px; background:#fff; opacity:.9; animation:drift 14s ease-in-out infinite alternate;}
.pet-cloud::before{content:''; position:absolute; left:22%; top:-12px; width:30px; height:28px; border-radius:50%; background:#fff;}
@keyframes drift{to{transform:translateX(26px);}}
.pet-ground{position:absolute; left:-12%; right:-12%; bottom:-70px; height:150px; border-radius:50% 50% 0 0; background:linear-gradient(180deg,#8FD16E,#6DB84E);}
.pet-scene .deco{z-index:1;}
.pet-stage{position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:250px; z-index:2;}
.pet-svg{width:100%; height:auto; display:block; overflow:visible;}
.pet-bob{transform-box:fill-box; transform-origin:50% 100%; animation:pet-breathe 3s ease-in-out infinite;}
.pet-egg .pet-bob{animation:pet-wobble 2.6s ease-in-out infinite;}
.pet-svg.happy .pet-bob{animation:pet-jump .6s cubic-bezier(.34,1.56,.64,1);}
.pet-eyes{transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite;}
@keyframes pet-breathe{0%,100%{transform:scale(1,1);} 50%{transform:scale(1.03,.97);}}
@keyframes pet-wobble{0%,60%,100%{transform:rotate(0);} 20%{transform:rotate(-5deg);} 40%{transform:rotate(4deg);}}
@keyframes pet-jump{0%{transform:translateY(0);} 40%{transform:translateY(-26px) scale(.96,1.05);} 100%{transform:translateY(0);}}
.pet-sparkle{transform-box:fill-box; transform-origin:center; animation:twinkle 1.8s ease-in-out infinite;}
.pet-sparkle:nth-of-type(2n){animation-delay:-.9s;}
@keyframes twinkle{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(.6); opacity:.6;}}
@keyframes blink{0%,93%,100%{transform:scaleY(1);} 96%{transform:scaleY(.1);}}
.float-heart{position:absolute; z-index:5; pointer-events:none; opacity:0; animation:float-up 1.1s ease-out forwards;}
@keyframes float-up{0%{transform:translate(-50%,0) scale(.6); opacity:0;} 20%{opacity:1;} 100%{transform:translate(-50%,-90px) scale(1.1); opacity:0;}}
.pet-info{background:var(--paper); border:2px solid var(--line); border-radius:24px; padding:14px 16px; margin-top:16px; text-align:center; box-shadow:0 4px 0 var(--line);}
.pet-info .pet-name{font-size:26px; font-weight:900; color:var(--ink); margin:0;}
.pet-bar{height:16px; border-radius:100px; background:#EADBC2; overflow:hidden; margin:10px 0 8px;}
.pet-bar-fill{height:100%; min-width:16px; border-radius:100px; background:linear-gradient(180deg,#FFD95A,#F2AE1F); transition:width .5s;}
.pet-next{display:flex; align-items:center; justify-content:center; gap:5px; font-size:14px; font-weight:800; color:var(--ink-soft);}
.pet-kind{font-size:13px; font-weight:800; color:var(--muted); margin-top:2px;}
.pet-hint{font-size:12px; font-weight:700; color:var(--muted); margin-top:4px;}
.pet-sleep .pet-bob{animation:pet-breathe 4s ease-in-out infinite;}
.pet-zzz{animation:twinkle 2.4s ease-in-out infinite;}
.house{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.friend-card{font-family:inherit; position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px 10px; border-radius:20px; background:var(--paper); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); cursor:pointer; color:inherit; top:0;}
button.friend-card:active{top:3px; box-shadow:0 1px 0 var(--line);}
.friend-card.on{border-color:var(--leaf); background:var(--leaf-light); box-shadow:0 4px 0 var(--leaf);}
.friend-card.mystery{cursor:default; background:#F6EEDF;}
.friend-pic{position:relative; width:84px; height:80px;}
.friend-pic .pet-bob, .friend-pic .pet-eyes, .friend-pic .pet-sparkle, .friend-pic .pet-zzz{animation:none;}
.mystery .pet-svg{filter:brightness(0); opacity:.16;}
.friend-q{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-top:10px; font-size:38px; font-weight:900; color:var(--muted);}
.friend-name{font-size:13px; font-weight:900; color:var(--ink); text-align:center; line-height:1.15;}
.friend-sub{font-size:11px; font-weight:800; color:var(--muted); text-align:center; line-height:1.15; display:flex; align-items:center; gap:3px;}
.friend-card.on .friend-sub{color:var(--leaf-dark);}
.goal-pill{display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:8px 12px 8px 8px; border-radius:20px; background:#FFF0CC; border:2px solid #FFE08A; box-shadow:0 3px 0 #FFE08A;}
.goal-pill img{flex-shrink:0;}
.goal-main{flex:1; min-width:0;}
.goal-text{font-size:14px; font-weight:900; color:#9A6411; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.goal-bar{height:10px; border-radius:10px; background:#F6DFA8; overflow:hidden; margin-top:5px;}
.goal-bar-fill{height:100%; min-width:10px; border-radius:10px; background:linear-gradient(180deg,#FFD95A,#F2AE1F); transition:width .5s;}
.goal-num{display:flex; align-items:center; gap:3px; font-size:14px; font-weight:900; color:#9A6411; flex-shrink:0;}
.goal-pill.slim{flex-basis:100%; margin:0; padding:3px 10px 3px 4px; gap:8px; border-radius:16px; box-shadow:none;}
.goal-pill.slim img{width:30px; height:30px;}
.goal-pill.slim .goal-text{font-size:13px;}
.goal-pill.slim .goal-bar{height:8px; margin-top:3px;}
.goal-pill.done{background:var(--leaf-light); border-color:#BFE3A8; box-shadow:0 3px 0 #BFE3A8; animation:pulse-goal 1.6s ease-in-out infinite;}
.goal-pill.done .goal-text, .goal-pill.done .goal-num{color:var(--leaf-dark);}
.goal-pill.done .goal-bar-fill{background:var(--leaf);}
@keyframes pulse-goal{50%{transform:scale(1.025);}}
.goal-reward{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; color:var(--ink); margin-bottom:10px;}
.support-card{background:#FFF1EF; border-color:#F8CFCA;}
.support-head{display:flex; align-items:center; gap:8px;}
.support-title{font-size:18px; font-weight:900; color:var(--berry-shadow);}
.support-text{font-size:14px; font-weight:700; color:var(--ink-soft); line-height:1.4; margin:8px 0 4px;}
.support-card .btn{text-decoration:none;}
.support-btn{flex-direction:column; gap:1px; padding:12px 18px;}
.support-btn-main{display:flex; align-items:center; gap:8px;}
.support-btn-note{font-size:12px; font-weight:800; opacity:.8;}
.crypto-net{font-size:14px; font-weight:800; color:var(--ink-soft); line-height:1.35; margin-top:4px;}
.crypto-qr{display:block; width:200px; height:200px; margin:10px auto 6px; border-radius:12px; border:2px solid var(--line);}
.crypto-addr{font-family:ui-monospace, Consolas, monospace; font-size:14px; font-weight:700; color:var(--ink); background:#F6EEDF; border-radius:12px; padding:8px 10px; overflow-wrap:anywhere; user-select:all; -webkit-user-select:all;}
.crypto-warn{font-size:12px; font-weight:800; color:var(--berry-shadow); margin:8px 0 0; line-height:1.35;}
.install-why{font-size:14px; font-weight:800; color:var(--ink); margin:0 0 8px;}
.install-steps{margin:0; padding-left:20px; font-size:14px; font-weight:700; color:var(--ink-soft); line-height:1.5;}
.install-card .btn{margin-top:4px;}
.goal-input{font-family:inherit; width:100%; font-size:16px; font-weight:800; color:var(--ink); padding:11px 14px; border-radius:14px; border:2px solid var(--line-dark); background:#fff;}
.goal-input:focus{outline:none; border-color:var(--sky);}
.pet-bubble{position:absolute; z-index:6; left:50%; top:14px; transform:translateX(-50%); max-width:86%; padding:8px 16px; border-radius:20px; background:#fff; border:3px solid var(--ink); text-align:center; pointer-events:none; animation:bubble-in 3.2s ease forwards;}
.pet-bubble::after{content:''; position:absolute; left:50%; bottom:-12px; margin-left:-9px; border:9px solid transparent; border-top-color:var(--ink); border-bottom:0;}
.pet-bubble-en{font-size:22px; font-weight:900; color:var(--ink); line-height:1.15;}
.pet-bubble-ru{font-size:13px; font-weight:800; color:var(--muted);}
@keyframes bubble-in{0%{opacity:0; transform:translateX(-50%) scale(.6);} 8%{opacity:1; transform:translateX(-50%) scale(1.05);} 12%,88%{opacity:1; transform:translateX(-50%) scale(1);} 100%{opacity:0; transform:translateX(-50%) scale(1);}}
.grow-row{display:flex; align-items:flex-end; justify-content:center; gap:4px; margin-top:6px;}
.grow-old{width:92px; opacity:.55;}
.grow-new{width:170px;}
.grow-arrow{padding-bottom:50px; animation:bob 1.6s ease-in-out infinite;}
.pop-layer{position:absolute; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(59,42,26,.45); animation:fade-in .25s;}
.pop-card{width:100%; max-width:360px; background:var(--paper); border-radius:30px; padding:20px 20px 18px; text-align:center; border:3px solid #FFE08A; box-shadow:0 8px 0 rgba(110,69,36,.25); animation:bounce-in .5s cubic-bezier(.34,1.56,.64,1);}
.pop-title{font-size:28px; font-weight:900; color:var(--leaf-dark);}
.pop-pet{width:190px; margin:4px auto 0;}
.pop-text{font-size:16px; font-weight:800; color:var(--ink-soft); line-height:1.35; margin-top:6px;}
.pop-gift{width:110px; height:110px; display:block; margin:0 auto 4px; animation:bob 2.2s ease-in-out infinite;}
.pop-reward{font-size:24px; font-weight:900; color:#B7791F; margin:6px 0 2px; overflow-wrap:anywhere;}
.pop-show{display:inline-block; margin-top:10px; padding:6px 14px; border-radius:100px; background:var(--berry-light); color:var(--berry-shadow); font-size:17px; font-weight:900;}
@keyframes fade-in{from{opacity:0;}}
.pet-steps{display:flex; justify-content:center; align-items:center; gap:6px; margin-top:10px;}
.pet-steps span{width:10px; height:10px; border-radius:6px; background:#EADBC2;}
.pet-steps span.on{background:var(--leaf);}
.pet-steps span.cur{width:24px;}
.wardrobe{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.ward{
  font-family:inherit; position:relative; top:0; background:var(--paper); border:3px solid var(--line); border-radius:20px;
  padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; box-shadow:0 4px 0 var(--line);
}
.ward:active{top:3px; box-shadow:0 1px 0 var(--line);}
.ward.worn{border-color:var(--leaf); background:var(--leaf-light); box-shadow:0 4px 0 var(--leaf);}
.ward.locked > svg:first-child{filter:grayscale(1); opacity:.35;}
.ward-name, .ward-req{font-size:12px; font-weight:900; color:var(--ink-soft); display:flex; align-items:center; gap:3px;}

.ward-lock{position:absolute; top:5px; right:5px;}
.ward.nope{animation:shake .35s;}
.badges{display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; padding-bottom:6px;}
.badge{display:flex; flex-direction:column; align-items:center; gap:5px;}
.badge-ring{width:64px; height:64px; border-radius:50%; padding:5px; background:conic-gradient(var(--c) var(--p), #EADBC2 0); box-shadow:0 4px 0 rgba(110,69,36,.18);}
.badge.done .badge-ring{background:linear-gradient(180deg,#FFD95A,#F2AE1F);}
.badge-pic{width:100%; height:100%; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center;}
.badge.empty .badge-pic > *{filter:grayscale(1); opacity:.4;}
.badge-name{font-size:11px; font-weight:800; color:var(--ink-soft); text-align:center; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

/* ===== Финал урока ===== */
.screen-sessionEnd{display:flex; flex-direction:column; padding-top:20px;}
.end-wrap{flex:1;}
.end-hero{
  text-align:center; padding:16px 16px 20px; border-radius:32px;
  background:radial-gradient(circle at 50% 22%, #FFF1C2 0, transparent 58%), linear-gradient(180deg,#E4F4D6,#FFF6E6);
  border:3px solid #CFE7C0; box-shadow:0 6px 0 #CFE7C0;
}
.end-stars{display:flex; justify-content:center; align-items:flex-end; gap:2px; height:92px;}
.end-star{display:inline-block; transform:scale(0); animation:star-pop .55s cubic-bezier(.34,1.56,.64,1) forwards;}
.end-star:nth-child(1) svg{transform:rotate(-14deg) translateY(4px);}
.end-star:nth-child(3) svg{transform:rotate(14deg) translateY(4px);}
@keyframes star-pop{0%{transform:scale(0) rotate(-40deg);} 100%{transform:scale(1) rotate(0);}}
.end-worm{width:104px; height:112px; margin:4px auto 0; animation:bob 2.2s ease-in-out infinite;}
.end-worm svg{width:100%; height:100%; display:block;}
.end-title{font-size:30px; font-weight:900; color:var(--leaf-dark); margin:6px 0 2px;}
.end-sub{font-size:15px; font-weight:800; color:var(--ink-soft);}
.end-chip{

  background:var(--paper); border:2px solid var(--line); font-size:18px; font-weight:900; color:var(--ink-soft);

}

.unlock-card{display:flex; align-items:center; gap:12px; margin-top:14px; padding:10px 14px; border-radius:22px; background:#FFF0CC; border:2px solid #FFE08A; animation:bounce-in .5s cubic-bezier(.34,1.56,.64,1) 1.6s both;}

.word-chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}

  padding:8px 10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:15px; font-weight:900; color:var(--leaf-dark);
  cursor:pointer; box-shadow:0 3px 0 var(--line);
}

.day-pill{font-family:inherit; border:2px solid transparent;}
.switch{position:relative; width:54px; height:32px; flex-shrink:0;}

.dash-details{background:var(--paper); border:2px solid var(--line); border-radius:18px; padding:12px 14px; margin-top:10px; font-size:13px; color:var(--ink-soft); line-height:1.5; font-weight:700;}

<body>
<div class="app" id="app"></div>
<!-- Данные курса: слова и уроки, станции правил, станции звуков -->
<script src="data/course.js"></script>
<script src="data/grammar.js"></script>
<script src="data/sounds.js"></script>
<script src="data/examples.js"></script>
<script>
// Картинка слова: SVG из OpenMoji (assets/images/<id>.svg); нет файла — эмодзи; нет эмодзи — плашка «Aa»
function wImg(w, px){
  if(!w) return '';
  if(!w.emoji) return `<span class="nopic" style="width:${px}px; height:${px}px;">${icon('abc', Math.round(px*0.8))}</span>`;
  return `<img src="assets/images/${w.id}.svg" alt="${w.en}" width="${px}" height="${px}" loading="lazy" style="object-fit:contain" onerror="this.outerHTML='<span style=&quot;font-size:${Math.round(px*0.8)}px&quot;>${w.emoji}</span>'">`;
}

/* ============================= ДАННЫЕ КУРСА ============================= */
// Курс лежит в data/course.js: LEVEL → UNIT (тема на тропе) → LESSON (урок) → слова, STATION — место станции.
// Станции правил описаны в data/grammar.js, станции звуков — в data/sounds.js.
// Станция «Один и много» (plural) собрана в движке вручную.
const PLURAL_SPEC = { title:'Один и много', explains:['a', 'how', 'many'] };
const LEVELS = [], SECTIONS = [], STATIONS = [];
(function parseCourse(){
  let level = null, section = null, lesson = null;
  const parts = s => s.split('|').map(x=>x.trim());
  window.COURSE_TEXT.split('\n').forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('LEVEL ')){ const [num, title, subtitle] = parts(line.slice(6)); level = { num:+num, title, subtitle }; LEVELS.push(level); return; }
    if(line.startsWith('UNIT ')){ const [id, title, color] = parts(line.slice(5)); section = { id, title, color, level:level.num, lessons:[] }; SECTIONS.push(section); return; }
    if(line.startsWith('LESSON ')){ const [id, title] = parts(line.slice(7)); lesson = { id, title, words:[] }; section.lessons.push(lesson); return; }
    if(line.startsWith('STATION ')){
      const [head, explicitId] = parts(line.slice(8));
      const [type, topic] = head.split(/\s+/);
      const spec = topic === 'plural' ? PLURAL_SPEC : (type === 'grammar' ? window.GRAMMAR : window.SOUNDS)[topic];
      if(!spec){ console.warn('Нет описания станции', topic); return; }
      const st = { id: explicitId || `${type === 'grammar' ? 'gr' : 'snd'}_${topic}`, type, topic, spec, title: spec.title };
      STATIONS.push(st);
      section.lessons.push({ id: st.id, kind:'station', title: st.title, words:[], station: st });
      return;
    }
    const [en, ru, ipa, emoji, pos, id] = parts(line);
    lesson.words.push({ en, ru, ipa, emoji: emoji === '-' ? '' : emoji, pos, id });
  });
})();

/* ============================= КОНСТАНТЫ ============================= */
const UNLOCK_THRESHOLD = 0.7;
const FLIP_MIN_DELAY_MS = 2000;

function maxStarsForLesson(lesson){ return lesson.kind === 'station' ? 3 : lesson.words.length * 3; }
function maxStarsForSection(section){ return section.lessons.reduce((a,l)=>a+maxStarsForLesson(l),0); }
const MAX_TOTAL_STARS = SECTIONS.reduce((sum,s)=> sum + maxStarsForSection(s), 0);

// Друзья: на каждом уровне свой, растёт от звёзд своего уровня (рисуется в petSvg).
// Пороги стадий — доли от всех звёзд уровня: у цыплёнка это примерно 30, 90, 200, 400, 700, 1100.
const FRIEND_STEPS = [0, .02, .06, .14, .28, .48, .76];
const FRIENDS = [
  { level:1, species:'chick', title:'Цыплёнок', names:['Яйцо', 'Птенчик', 'Цыплёнок', 'Пушистик', 'Умник', 'Чемпион', 'Король слов'] },
  { level:2, species:'fox',   title:'Лисёнок',  names:['Клубочек', 'Лисёнок', 'Рыжик', 'Пушистый хвост', 'Хитрый умник', 'Чемпион', 'Король леса'] },
  { level:3, species:'eagle', title:'Орлёнок',  names:['Яйцо в гнезде', 'Орлёнок', 'Пёрышко', 'Смелое крыло', 'Зоркий глаз', 'Чемпион', 'Король гор'] },
];
// head — головные уборы: одновременно надет только один
const ACCESSORIES = [
  {id:'bow',     req:25,  name:'Бантик'},
  {id:'glasses', req:75,  name:'Очки'},
  {id:'hat',     req:150, name:'Шляпа', head:true},
  {id:'crown',   req:300, name:'Корона', head:true},
  {id:'medal',   req:500, name:'Медаль'},
  {id:'trophy',  req:800, name:'Кубок'},
];

/* ============================= STATE ============================= */
const STORAGE_KEY = 'engAppStateV4';
function defaultState(){
  return {
    progress: {},
    streak: { count:0, lastDateStr:null, freezeAvailable:true },
    settings: { timeLimit:30, reminderDays:['Пн','Ср','Пт'], voice:'US', soundOn:true },
    petOff: [], // аксессуары, которые ребёнок снял с питомца (остальные открытые надеты)
    friendsSeen: [], // уровни, чьих друзей уже показали в окне «Новый друг!»
    petShow: null,   // какого друга из «Лесного домика» показывать на полянке (null — текущего)
    goal: null,      // цель от родителей: {start, target, text, done}
    friendStages: null, // {уровень: стадия}, которую ребёнок уже видел — чтобы поздравить, когда друг подрастёт
    simDayOffset: 0,
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){}
  return defaultState();
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); }
let appState = loadState();

// Локальная дата (а не UTC), иначе в Москве день «переключается» в 3 часа ночи
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){
  const d = new Date();
  d.setDate(d.getDate() + appState.simDayOffset);
  return localDateStr(d);
}
function daysBetween(a, b){
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 86400000);
}
// Стрик для показа: если ребёнок пропустил дни (и заморозка не спасает), показываем 0
function currentStreak(){
  const s = appState.streak;
  if(!s.lastDateStr) return 0;
  const gap = daysBetween(s.lastDateStr, todayStr());
  if(gap <= 1) return s.count;
  if(gap === 2 && s.freezeAvailable) return s.count;
  return 0;
}
function markActiveToday(){
  const today = todayStr();
  if(appState.streak.lastDateStr === today) return;
  const prev = appState.streak.lastDateStr;
  if(prev){
    const diffDays = daysBetween(prev, today);
    if(diffDays === 1){ appState.streak.count++; }
    else if(diffDays > 1){
      if(appState.streak.freezeAvailable && diffDays === 2){
        appState.streak.freezeAvailable = false;
        appState.streak.count++;
      } else {
        appState.streak.count = 1;
        appState.streak.freezeAvailable = true;
      }
    }
  } else {
    appState.streak.count = 1;
  }
  appState.streak.lastDateStr = today;
  saveState();
}
function simulateNextDay(){
  appState.simDayOffset++;
  saveState();
  render();
}

function totalStarsEarned(){
  return Object.values(appState.progress).reduce((a,b)=>a+b,0);
}
// Звёзды станции хранятся под ключом g_<id> (0–3), звёзды слов — под id слова
function lessonStars(lesson){
  if(lesson.kind === 'station') return appState.progress['g_' + lesson.id] || 0;
  return lesson.words.reduce((sum,w)=> sum + (appState.progress[w.id]||0), 0);
}
function sectionStars(section){
  return section.lessons.reduce((sum,l)=> sum + lessonStars(l), 0);
}
const FLAT_LESSONS = [];
SECTIONS.forEach(s => s.lessons.forEach(l => FLAT_LESSONS.push({section:s, lesson:l})));
function flatLessons(){ return FLAT_LESSONS; }
// realOnly — по настоящему прогрессу, без демо-режима «Открыть все уроки»
function isLessonUnlocked(flatIdx, realOnly){
  if(flatIdx === 0 || (!realOnly && appState.settings.unlockAll)) return true;
  const flat = flatLessons();
  // Уже начатый урок не закрываем — например, если станцию добавили перед ним позже
  if(lessonStars(flat[flatIdx].lesson) > 0) return true;
  const prev = flat[flatIdx-1].lesson;
  if(prev.kind === 'station') return lessonStars(prev) >= 2;
  return lessonStars(prev) >= maxStarsForLesson(prev) * UNLOCK_THRESHOLD;
}
// Самый дальний урок, открытый настоящим прогрессом (без демо-режима)
function frontierIdx(){
  let i = 0;
  while(i + 1 < FLAT_LESSONS.length && isLessonUnlocked(i + 1, true)) i++;
  return i;
}
function levelStars(num){ return SECTIONS.filter(s=>s.level === num).reduce((a, s)=>a + sectionStars(s), 0); }
function levelMaxStars(num){ return SECTIONS.filter(s=>s.level === num).reduce((a, s)=>a + maxStarsForSection(s), 0); }
// Уровень, до которого ребёнок дошёл: его друг сейчас растёт
function currentLevel(){ return FLAT_LESSONS[frontierIdx()].section.level; }
function friendInfo(friend){
  const max = levelMaxStars(friend.level);
  const stars = levelStars(friend.level);
  const mins = FRIEND_STEPS.map(p=>Math.round(p * max));
  let idx = 0;
  mins.forEach((m, i)=>{ if(stars >= m) idx = i; });
  const next = idx + 1 < mins.length ? { min: mins[idx + 1], name: friend.names[idx + 1] } : null;
  return { friend, idx, name: friend.names[idx], min: mins[idx], next, stars, met: friend.level <= currentLevel() };
}

const audioContext = new (window.AudioContext || window.webkitAudioContext)();
// Браузеры создают AudioContext «на паузе» до первого касания — будим его
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, ()=>{
  if(audioContext.state === 'suspended') audioContext.resume();
}, {passive:true}));
function playTone(freq, duration, type='sine'){
  if(!appState.settings.soundOn) return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.value = freq;
  osc.type = type;
  gain.gain.setValueAtTime(0.1, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
  osc.start();
  osc.stop(audioContext.currentTime + duration);
}
function soundCorrect(){ playTone(523, 0.1); setTimeout(()=>playTone(659, 0.15), 80); }
function soundWrong(){ playTone(200, 0.3, 'sawtooth'); }

// Озвучка: сначала готовый файл assets/audio/<us|uk>/<id>.mp3 (нейросетевой голос),
// если файла нет — голос браузера. Отсутствующие файлы запоминаем, чтобы не ждать их снова.
const WORD_ID_BY_EN = {};
SECTIONS.forEach(s=>s.lessons.forEach(l=>l.words.forEach(w=>{ WORD_ID_BY_EN[w.en.toLowerCase()] = w.id; })));
const missingAudio = new Set();
let currentAudio = null;
function stopAllSpeech(){
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function speak(text){
  stopAllSpeech();
  const id = WORD_ID_BY_EN[text.toLowerCase()];
  const src = id && `assets/audio/${appState.settings.voice === 'UK' ? 'uk' : 'us'}/${id}.mp3`;
  if(!src || missingAudio.has(src)){ speakWithBrowser(text); return; }
  const audio = new Audio(src);
  currentAudio = audio;
  const fallback = ()=>{
    missingAudio.add(src);
    if(currentAudio === audio){ currentAudio = null; speakWithBrowser(text); }
  };
  audio.onerror = fallback;
  audio.play().catch(err=>{ if(err.name !== 'AbortError') fallback(); });
}
function speakSlow(text){ stopAllSpeech(); speakWithBrowser(text, 0.55); }
function speakWithBrowser(text, rate = 0.85){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = appState.settings.voice === 'UK' ? 'en-GB' : 'en-US';
  u.rate = rate;
  const v = voices.find(v=>v.lang && v.lang.startsWith('en') && (appState.settings.voice==='UK' ? v.lang.includes('GB') : v.lang.includes('US')));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

function lessonStarCount(lesson){
  if(lesson.kind === 'station') return lessonStars(lesson);
  const r = lessonStars(lesson) / maxStarsForLesson(lesson);
  return r >= 1 ? 3 : r >= UNLOCK_THRESHOLD ? 2 : r > 0 ? 1 : 0;
}
function trailPathD(points, height){
  // Плавная кривая через все уроки; координата x в процентах (viewBox шириной 100)
  let d = `M50 0 C50 ${points[0].y/2} ${points[0].x} ${points[0].y/2} ${points[0].x} ${points[0].y}`;
  for(let i=1; i<points.length; i++){
    const a = points[i-1], b = points[i], mid = (a.y + b.y) / 2;
    d += ` C${a.x} ${mid} ${b.x} ${mid} ${b.x} ${b.y}`;
  }
  const last = points[points.length-1];
  d += ` C${last.x} ${(last.y+height)/2} 50 ${(last.y+height)/2} 50 ${height}`;
  return d;
}

      const starCount = lessonStarCount(lesson);
      const pct = Math.round(lessonStars(lesson) / maxStarsForLesson(lesson) * 100);
      const state = !unlocked ? 'locked' : starCount === 3 ? 'done' : 'open';
      const isCurrent = idx === currentIdx;
      return `
        <div class="node ${state} ${isCurrent?'current':''} ${lesson.kind==='station'?'station':''}" style="left:${x}%; top:${y}px; --c:${section.color}; --p:${pct}%;">
          ${lesson.kind==='station' ? `<div class="node-tag ${lesson.station.type}">${lesson.station.type === 'sound' ? 'звуки' : 'правило'}</div>` : ''}
          <button class="node-btn" onclick="${unlocked ? `openLesson('${lesson.id}')` : 'nodeLocked(this)'}" aria-label="${lesson.title}">
            <span class="node-pic">${lessonPicHtml(lesson, 46)}</span>
            ${state==='locked' ? `<span class="node-badge">${icon('lock',22)}</span>` : ''}
            ${state==='done' ? `<span class="node-badge ok">${icon('check',20)}</span>` : ''}
          </button>
          ${unlocked && starCount > 0 ? `<div class="node-stars">${starsRow(starCount, 24)}</div>` : ''}
          <div class="node-label">${lesson.title}</div>
          ${isCurrent ? `<div class="node-worm ${x > 50 ? 'left' : 'right'}">${wormSvg('wait')}</div>` : ''}
        </div>`;
    }).join('');

    // Украшения ставим на противоположную от урока сторону тропы
    const decoHtml = points.map((p, li)=>{
      const seed = si*7 + li*3;
      const side = p.x > 50 ? 15 : p.x < 50 ? 85 : (seed % 2 ? 12 : 88);
      const size = 38 + (seed % 3) * 8;
      const id = DECOR[seed % DECOR.length];
      return `<img class="deco" src="assets/images/${id}.svg" alt="" style="left:${side}%; top:${p.y + 14}px; width:${size}px; height:${size}px;" onerror="this.remove()">`;
    }).join('');

    return `
      ${si === 0 || SECTIONS[si-1].level !== section.level ? levelBanner(section.level) : ''}
      <section class="glade" style="--tint:${section.color}24;">
        <div class="glade-sign">
          <div class="sign-pic">${wImg(sectionPicWord(section), 40)}</div>
          <div>
            <div class="sign-title">${section.title}</div>
            <div class="sign-meta">${icon('star',16)} ${sStars} / ${sMax}</div>
          </div>
        </div>
        <div class="trail" style="height:${height}px;">
          <svg class="trail-path" viewBox="0 0 100 ${height}" preserveAspectRatio="none" aria-hidden="true">
            <path d="${trailPathD(points, height)}" fill="none" stroke="#E9D3AA" stroke-width="30" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            <path d="${trailPathD(points, height)}" fill="none" stroke="#F8ECD4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14" vector-effect="non-scaling-stroke"/>
          </svg>
          ${decoHtml}
          ${nodesHtml}
        </div>
      </section>`;
  }).join('');

  return `
    <div class="map-top">
      <div class="chip">${icon('flame',28)} ${currentStreak()}</div>
      <div class="map-top-title">Лесная тропа</div>
      <div class="chip">${icon('star',28)} ${total}</div>
      ${goalPillHtml(true)}
    </div>
    ${sectionsHtml}
    <button class="btn btn-ghost" onclick="simulateNextDay()">(демо) Симулировать новый день</button>
  `;
}

/* ============================= LESSON SESSION ============================= */
function openLesson(lessonId){
  soundClick();
  vibrate(10);
  let found = null, foundSection = null;
  for(const s of SECTIONS){
    const l = s.lessons.find(l=>l.id===lessonId);
    if(l){ found = l; foundSection = s; break; }
  }
  if(found.kind === 'station'){
    session = { kind:'station', sectionId:foundSection.id, lessonId, steps: buildStationSteps(found.station), stepIdx:0 };
    screen = 'lesson';
    render();
    return;
  }
  session = {
    sectionId: foundSection.id,
    lessonId: lessonId,
    stages: ['flashcard','recognition','assembly','typing','dictation'],
    stageIdx: 0,
    wordIdx: 0,
    words: found.words,
    results: {},
  };
  found.words.forEach(w => session.results[w.id] = {rec:false, asm:false, typ:false, dic:false});
  screen = 'lesson';
  render();
}

function renderLessonScreen(){
  if(session.kind === 'station') return renderGrammarScreen();
  const section = SECTIONS.find(s=>s.id===session.sectionId);
  const lesson = section.lessons.find(l=>l.id===session.lessonId);
  const stageKey = session.stages[session.stageIdx];
  const totalSteps = session.stages.length * session.words.length;
  const doneSteps = session.stageIdx * session.words.length + session.wordIdx;
  const pct = Math.round(doneSteps/totalSteps*100);

  let inner = '';
  if(stageKey === 'flashcard') inner = renderFlashcard();
  else if(stageKey === 'recognition') inner = renderRecognition();
  else if(stageKey === 'assembly') inner = renderAssembly();
  else if(stageKey === 'typing') inner = renderTyping(false);
  else if(stageKey === 'dictation') inner = renderTyping(true);

  return `
    <div class="lesson-top">
      <button class="round-btn" onclick="exitLesson()" aria-label="Выйти из урока">${icon('close',26)}</button>
      <div class="lprogress"><div class="lprogress-fill" style="width:${pct}%"></div></div>
      <div class="lesson-pic">${wImg(lesson.words[0], 38)}</div>
    </div>
    ${inner}
  `;
}
// Картинка урока: у обычного — первое слово, у станции — маленькая сцена по её теме
function lessonPicHtml(lesson, px){
  if(lesson.kind === 'station') return `<span class="station-pic">${stationPicWords(lesson.station).map(w=>wImg(w, Math.round(px*0.5))).join('')}</span>`;
  return wImg(lesson.words.find(w=>w.emoji) || lesson.words[0], px);
}
function exitLesson(){
  const isGrammar = session.kind === 'station';
  if(confirm(isGrammar ? 'Выйти со станции? Звёзды начисляются, только когда пройдёшь её до конца.' : 'Выйти из урока? Заработанные звёзды сохранятся.')){
    if(flashcardTimerId){ clearTimeout(flashcardTimerId); flashcardTimerId = null; }
    const gained = isGrammar ? 0 : applySessionResults();
    if(gained > 0){ markActiveToday(); }
    saveState();
    screen = 'map'; session = null; render();
  }
}
function currentWord(){ return session.words[session.wordIdx]; }

// Слова без картинки показываем примером-предложением из data/examples.js (*слово* — подсветка):
// на лицевой стороне и в заданиях — русский пример (чтобы не подсказать ответ), на обороте — английский с озвучкой
function exampleOf(w){ return (window.EXAMPLES || {})[w.en.toLowerCase()]; }
const exampleHtml = s => esc(s).replace(/\*([^*]+)\*/g, '<b class="hl">$1</b>');
const examplePlain = s => s.replace(/\*/g, '');
function wordVisual(w, px, side){
  const ex = !w.emoji && exampleOf(w);
  if(!ex) return wImg(w, px);
  if(side === 'en') return `<button class="example-card en" onclick="event.stopPropagation(); speak(${jsq(examplePlain(ex[0]))})" aria-label="Послушать пример">${icon('speaker',22)}<span>${exampleHtml(ex[0])}</span></button>`;
  return `<div class="example-card ru"><span class="ex-quote">«</span>${exampleHtml(ex[1])}<span class="ex-quote">»</span></div>`;
}

// Крупная картинка задания (или пример) + русское слово
function promptHtml(w, compact){
  if(!w.emoji && exampleOf(w)) return `
    <div class="prompt">
      ${wordVisual(w, 0, 'ru')}
      <div class="word-ru">${w.ru}</div>
    </div>`;
  return `
    <div class="prompt ${compact ? 'compact' : ''}">
      <div class="prompt-pic">${wImg(w, compact ? 104 : 140)}</div>
      <div class="word-ru">${w.ru}</div>
    </div>`;
}

/* ---- FLASHCARD ---- */
let flashcardFlippedOnce = false;
let flashcardTimerId = null;
function renderFlashcard(){
  flashcardFlippedOnce = false;
  if(flashcardTimerId){ clearTimeout(flashcardTimerId); flashcardTimerId = null; }
  const w = currentWord();
  return `
    <div class="stage">
      <div class="card-scene">
        <div class="card" id="flipCard" onclick="flipCard()">
          <div class="face front">
            <div class="emoji">${wordVisual(w, 170, 'ru')}</div>
            <div class="word-ru">${w.ru}</div>
            <div class="tap-hint">${icon('tap',40)}</div>
          </div>
          <div class="face back">
            <div>${wordVisual(w, 90, 'en')}</div>
            <div class="word-en">${phonicsHtml(w.en)}</div>
            ${trickyLine(w)}
            <div class="ipa">${w.ipa}</div>
            <button class="speak-btn" onclick="event.stopPropagation(); speak(${jsq(w.en)})" aria-label="Послушать">${icon('speaker',36)}</button>

      </div>
    </div>

      </button>

}
function flipCard(){
  soundClick();
  const el = document.getElementById('flipCard');
  el.classList.toggle('flipped');
  if(el.classList.contains('flipped')){
    setTimeout(()=>speak(currentWord().en), 350);
    if(!flashcardFlippedOnce){

      // Кнопка «заряжается» 2 секунды, пока ребёнок слушает слово — без текста с таймером
      document.getElementById('nextBtn').classList.add('charging');
      flashcardTimerId = setTimeout(()=>{
        const b = document.getElementById('nextBtn');
        if(b){ b.disabled = false; b.classList.remove('charging'); }
        soundCorrect();

/* ---- RECOGNITION ---- */
let recogAnswered = false;
function renderRecognition(){
  recogAnswered = false;
  const w = currentWord();
  // Всегда 4 варианта: сначала слова урока, затем добираем из темы и из всего словаря
  const valid = x => x.en!==w.en && x.ru!==w.ru;
  const section = SECTIONS.find(s=>s.id===session.sectionId);
  const sectionWords = section.lessons.flatMap(l=>l.words);
  const allWords = SECTIONS.flatMap(s=>s.lessons.flatMap(l=>l.words));
  const others = [];
  for(const pool of [session.words, sectionWords, allWords]){
    for(const x of shuffle(pool.filter(valid))){
      if(others.length >= 3) break;
      if(!others.includes(x.en)) others.push(x.en);
    }
  }
  const options = shuffle([w.en, ...others]);
  window.__recogCorrect = w.en;
  return `
    <div class="stage">
      ${promptHtml(w, false)}
      <div class="options">${options.map(o=>`<button class="opt-btn" onclick="checkRecog(this,'${o}')">${o}</button>`).join('')}</div>
    </div>
  `;
}
function checkRecog(btn, val){
  if(recogAnswered) return;
  recogAnswered = true;
  soundClick();
  const correct = window.__recogCorrect;
  const w = currentWord();
  const ok = val === correct;
  if(ok){
    btn.classList.add('correct');
    session.results[w.id].rec = true;
    soundCorrect();
    vibrate(50);
    speak(correct);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.textContent===correct) b.classList.add('correct'); });
    soundWrong();
    setTimeout(()=>speak(correct), 350);
  }
  setTimeout(()=>showFeedback(ok, w), 450);
}

/* ---- ASSEMBLY ---- */
let assemblyState = {};
function renderAssembly(){
  const w = currentWord();
  const hasSpaces = w.en.includes(' ');
  // Для словосочетаний с пробелом: каждое слово отдельно, между ними разделитель
  const parts = hasSpaces ? w.en.split(' ') : [w.en];
  let allLetters = [];
  let slots = [];
  parts.forEach((part, pi)=>{
    part.split('').forEach((ch, ci)=>{
      allLetters.push({l:ch, id:`${pi}_${ci}`});
      slots.push({type:'letter', char:ch, id:`${pi}_${ci}`});
    });
    if(pi < parts.length - 1) slots.push({type:'space'});
  });
  const shuffled = shuffle(allLetters);
  assemblyState = { slots, placed: new Array(slots.length).fill(null) };
  const slotsHtml = slots.map((s,i)=> s.type==='space' ?
    `<div class="slot space-sep"></div>` :
    `<div class="slot" id="slot-${i}" onclick="removeLetterFromSlot(${i})"></div>`
  ).join('');
  const tilesHtml = shuffled.map((t,i)=>`<div class="letter-tile pop-in" style="animation-delay:${i*40}ms" id="tile-${t.id}" onclick="placeLetter('${t.id}', '${t.l}')">${t.l.toUpperCase()}</div>`).join('');
  return `
    <div class="stage ${allLetters.length > 7 ? 'many' : ''}">
      ${promptHtml(w, true)}
      <div class="slots-row" id="slots">${slotsHtml}</div>
      <div class="letters-row" id="tiles">${tilesHtml}</div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="stage-actions spread">
      <button class="round-btn soft" onclick="removeLastLetter()" aria-label="Стереть последнюю букву">${icon('backspace',30)}</button>
      <button class="round-btn soft" onclick="clearAssembly()" aria-label="Начать заново">${icon('reset',30)}</button>
    </div>
  `;
}
function placeLetter(tileId, letter){
  soundClick();
  vibrate(5);
  const emptyIdx = assemblyState.placed.findIndex((p,i)=>p===null && assemblyState.slots[i].type==='letter');
  if(emptyIdx === -1) return;
  assemblyState.placed[emptyIdx] = {letter, tileId};
  const slot = document.getElementById(`slot-${emptyIdx}`);
  slot.textContent = letter.toUpperCase();
  slot.classList.add('filled');
  slot.classList.remove('wrong-slot');
  document.getElementById(`tile-${tileId}`).classList.add('used');
  document.getElementById('fb').textContent = '';
  const allFilled = assemblyState.slots.every((s,i)=>s.type!=='letter' || assemblyState.placed[i]);
  if(allFilled) checkAssembly();
}
function removeLetterFromSlot(slotIdx){
  const p = assemblyState.placed[slotIdx];
  if(!p) return;
  soundClick();
  document.getElementById(`tile-${p.tileId}`).classList.remove('used');
  assemblyState.placed[slotIdx] = null;
  const slot = document.getElementById(`slot-${slotIdx}`);
  slot.textContent = '';
  slot.classList.remove('filled', 'wrong-slot');
  document.getElementById('fb').textContent = '';
}
function removeLastLetter(){
  let lastIdx = -1;
  assemblyState.placed.forEach((p,i)=>{ if(p && assemblyState.slots[i].type==='letter') lastIdx = i; });
  if(lastIdx === -1) return;
  removeLetterFromSlot(lastIdx);
}
function clearAssembly(){
  assemblyState.placed.forEach((p,i)=>{
    if(p) document.getElementById(`tile-${p.tileId}`).classList.remove('used');
    if(assemblyState.slots[i].type==='letter'){
      const slot = document.getElementById(`slot-${i}`);
      slot.textContent=''; slot.classList.remove('filled', 'wrong-slot');
    }
  });
  assemblyState.placed = new Array(assemblyState.slots.length).fill(null);
  document.getElementById('fb').textContent='';
}
function checkAssembly(){
  const fb = document.getElementById('fb');
  const w = currentWord();
  let allCorrect = true;
  assemblyState.slots.forEach((s, i)=>{
    if(s.type==='letter'){
      const slot = document.getElementById(`slot-${i}`);
      const p = assemblyState.placed[i];
      if(p && p.letter.toLowerCase() === s.char.toLowerCase()){ slot.classList.remove('wrong-slot'); }
      else { allCorrect = false; slot.classList.add('wrong-slot'); }
    }
  });
  if(allCorrect){
    session.results[w.id].asm = true;
    soundCorrect();
    vibrate(50);
    speak(w.en);
    setTimeout(()=>showFeedback(true, w), 350);
  } else {
    fb.textContent = "Убери красные буквы"; fb.className="feedback bad";
    soundWrong();
  }
}

/* ---- TYPING / DICTATION ---- */
let typingState = {};
function buildSlotsMeta(word){
  const chars = word.split('');
  return chars.map(ch => isLetter(ch) ? {type:'input', char:ch} : {type:'sep', char:ch});
}
function renderTyping(isDictation){
  const w = currentWord();
  const meta = buildSlotsMeta(w.en);
  typingState = { meta, attempts:3, isDictation };
  let cellsHtml = '';
  meta.forEach((m, idx)=>{
    if(m.type==='input'){
      cellsHtml += `<input class="cell-input" maxlength="1" id="cell-${idx}" data-idx="${idx}" oninput="onCellInput(this, ${idx})" onkeydown="onCellKeydown(event, ${idx})" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
    } else { cellsHtml += `<div class="cell-sep"></div>`; }
  });
  const topPart = isDictation ? `
    <div class="listen-wrap">
      <button class="listen-btn" onclick="speak(${jsq(w.en)})" aria-label="Послушать слово">${icon('speaker',64)}</button>
      <div class="word-ru small">${w.ru}</div>
    </div>
  ` : promptHtml(w, true);
  const many = meta.filter(m=>m.type==='input').length > 7;
  return `
    <div class="stage">
      ${topPart}
      <div class="cells-row ${many ? 'many' : ''}">${cellsHtml}</div>
      <div class="hearts" id="hearts" aria-label="Попыток осталось: 3">${heartsRow(3)}</div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="stage-actions">
      <button class="round-btn soft" onclick="revealFirstLetter()" aria-label="Подсказка: первая буква">${icon('bulb',34)}</button>
      <button class="btn btn-primary grow" onclick="checkTyping(${isDictation})">Проверить</button>
    </div>
  `;
}
function getInputIdxs(){ return typingState.meta.map((m,i)=>m.type==='input'?i:null).filter(i=>i!==null); }
function focusCell(idx){ const el = document.getElementById(`cell-${idx}`); if(el){ el.focus(); el.select && el.select(); } }
function onCellInput(el, idx){
  el.value = el.value.replace(/[^a-zA-Z]/g,'').slice(0,1);
  const idxs = getInputIdxs(); const pos = idxs.indexOf(idx);
  if(el.value && pos < idxs.length-1) focusCell(idxs[pos+1]);
}
function onCellKeydown(e, idx){
  const idxs = getInputIdxs(); const pos = idxs.indexOf(idx);
  if(e.key === 'Backspace'){
    const el = document.getElementById(`cell-${idx}`);
    if(!el.value && pos>0){ e.preventDefault(); const prevEl = document.getElementById(`cell-${idxs[pos-1]}`); prevEl.value=''; focusCell(idxs[pos-1]); }
  } else if(e.key === 'ArrowLeft' && pos>0){ focusCell(idxs[pos-1]); }
  else if(e.key === 'ArrowRight' && pos<idxs.length-1){ focusCell(idxs[pos+1]); }
  else if(e.key === 'Enter'){ e.preventDefault(); checkTyping(typingState.isDictation); }
}
function revealFirstLetter(){
  soundClick();
  const idxs = getInputIdxs(); if(idxs.length===0) return;
  const el = document.getElementById(`cell-${idxs[0]}`);
  el.value = typingState.meta[idxs[0]].char; el.classList.add('correct');
  focusCell(idxs[1] ?? idxs[0]);
}
function checkTyping(isDictation){
  if(document.querySelector('.sheet-layer')) return; // ответ уже принят
  soundClick();
  const idxs = getInputIdxs();
  let allCorrect = true;
  idxs.forEach(i=>{
    const el = document.getElementById(`cell-${i}`);
    const expected = typingState.meta[i].char.toLowerCase();
    const got = (el.value||'').toLowerCase();
    el.classList.remove('wrong','correct');
    if(got === expected) el.classList.add('correct'); else { el.classList.add('wrong'); allCorrect = false; }
  });
  const fb = document.getElementById('fb');
  const w = currentWord();
  if(allCorrect){
    if(isDictation) session.results[w.id].dic = true; else session.results[w.id].typ = true;
    soundCorrect();
    vibrate(50);
    speak(w.en);
    setTimeout(()=>showFeedback(true, w), 350);
  } else {
    typingState.attempts--;
    const hearts = document.getElementById('hearts');
    hearts.innerHTML = heartsRow(Math.max(typingState.attempts,0));
    hearts.setAttribute('aria-label', `Попыток осталось: ${Math.max(typingState.attempts,0)}`);
    soundWrong();
    if(typingState.attempts <= 0){
      idxs.forEach(i=>{ const el = document.getElementById(`cell-${i}`); el.value = typingState.meta[i].char; el.classList.remove('wrong'); el.classList.add('correct'); el.disabled = true; });
      speak(w.en);
      setTimeout(()=>showFeedback(false, w), 500);
    } else {
      fb.textContent = "Попробуй ещё раз"; fb.className="feedback bad";
      idxs.forEach(i=>{ const el = document.getElementById(`cell-${i}`); if(el.classList.contains('wrong')) el.value=''; });
      focusCell(idxs.find(i=>!document.getElementById(`cell-${i}`).value) ?? idxs[0]);
    }
  }
}

/* ============================= СТАНЦИИ: движок ============================= */
// Станции правил строятся из data/grammar.js, станции звуков — из data/sounds.js.
// Станция «Один и много» (plural) — особая, собрана вручную ниже.
const WORD_BY_ID = {}, WORD_BY_EN = {};
SECTIONS.forEach(s=>s.lessons.forEach(l=>l.words.forEach(w=>{ WORD_BY_ID[w.id] = w; WORD_BY_EN[w.en.toLowerCase()] = w; })));
function wordByEn(en){ return WORD_BY_EN[String(en).trim().toLowerCase()]; }

/* ---- Множественное число (станция «Один и много») ---- */
const PLURAL_REGULAR = ['animals_1_cat','animals_1_dog','animals_1_rabbit','animals_2_bird','animals_3_horse','animals_3_cow','animals_3_pig'];
const PLURAL_IRREGULAR = { animals_2_mouse:'mice', animals_3_sheep:'sheep', animals_2_fish:'fish' };
// Слова-хитрецы: подсказка «почему» после задания и строчка на карточке слова
const TRICKY = {
  animals_2_mouse: 'слово-превращалка: <b>a mouse → two mice</b>',
  animals_3_sheep: 'слово-упрямец, не меняется: <b>a sheep → two sheep</b>',
  animals_2_fish:  'слово-упрямец, не меняется: <b>a fish → two fish</b>',
};
function trickyNote(id){ return TRICKY[id] ? `${icon('bolt',18)} <b>${WORD_BY_ID[id].en}</b> — ${TRICKY[id]}` : ''; }
// Русские формы для счёта: [один, 2–4, 5+], род — для «два кота / две собаки / пять мышей»
const RU_COUNT = {
  animals_1_cat:    ['кот','кота','котов','m'],
  animals_1_dog:    ['собака','собаки','собак','f'],
  animals_1_rabbit: ['кролик','кролика','кроликов','m'],
  animals_2_bird:   ['птичка','птички','птичек','f'],
  animals_2_fish:   ['рыбка','рыбки','рыбок','f'],
  animals_2_mouse:  ['мышь','мыши','мышей','f'],
  animals_3_horse:  ['лошадь','лошади','лошадей','f'],
  animals_3_cow:    ['корова','коровы','коров','f'],
  animals_3_pig:    ['свинья','свиньи','свиней','f'],
  animals_3_sheep:  ['овца','овцы','овец','f'],
};
// Множественное число любого существительного: особая форма из словаря (n:mice) или по правилам
function pluralOfWord(w){
  const m = /^n:(.+)$/.exec(w.pos || '');
  if(m) return m[1];
  const parts = w.en.toLowerCase().split(' ');
  let last = parts.pop();
  if(/(s|x|z|ch|sh)$/.test(last)) last += 'es';
  else if(/[^aeiou]y$/.test(last)) last = last.slice(0, -1) + 'ies';
  else last += 's';
  return [...parts, last].join(' ');
}
function plural(id){ return PLURAL_IRREGULAR[id] || pluralOfWord(WORD_BY_ID[id]); }
function countEn(id, n, art){ return n === 1 ? `${art || 'a'} ${WORD_BY_ID[id].en}` : `${NUM_EN[n]} ${plural(id)}`; }
// С подсветкой: «a» — синим, окончание -s или особая форма — красным
function countHtml(id, n, art){
  if(n === 1) return `<b class="hl-a">${art || 'a'}</b> ${WORD_BY_ID[id].en}`;
  const pl = PLURAL_IRREGULAR[id] ? `<b class="hl">${plural(id)}</b>` : `${WORD_BY_ID[id].en}<b class="hl">s</b>`;
  return `${NUM_EN[n]} ${pl}`;
}
function ruCount(id, n){
  const [one, few, many, g] = RU_COUNT[id];
  const num = n === 1 ? (g === 'f' ? 'одна' : 'один') : n === 2 ? (g === 'f' ? 'две' : 'два') : ['', '', '', 'три', 'четыре', 'пять'][n];
  return `${num} ${n === 1 ? one : n < 5 ? few : many}`;
}

function sceneSize(n){ return n <= 1 ? 96 : n === 2 ? 80 : n === 3 ? 66 : 54; }
function sceneHtml(id, n, size){
  const w = WORD_BY_ID[id];
  return `<span class="scene">${Array.from({length:n}, (_, i)=>`<span class="scene-item" style="animation-delay:${i*70}ms">${wImg(w, size)}</span>`).join('')}</span>`;
}
// Картинки по английским словам: 'cat,cat' — две кошки
function picsHtml(list, size){
  const ws = (Array.isArray(list) ? list : String(list || '').split(',')).map(s=>wordByEn(s)).filter(w=>w && w.emoji);
  if(!ws.length) return '';
  const sz = size || sceneSize(ws.length);
  return `<span class="scene">${ws.map((w, i)=>`<span class="scene-item" style="animation-delay:${i*70}ms">${wImg(w, sz)}</span>`).join('')}</span>`;
}

/* ---- Задания станции «Один и много» ---- */
const rnd25 = () => 2 + Math.floor(Math.random()*4); // 2..5
const T = {
  pickScene(id, n){
    const options = shuffle([n, ...shuffle([1,2,3,4,5].filter(x=>x!==n)).slice(0,2)]);
    return { type:'pickScene', scored:true, id, n, options, say:countEn(id,n), html:countHtml(id,n), fbEn:countEn(id,n), fbRu:ruCount(id,n), note:trickyNote(id) };
  },
  pickForm(id, n, opts){
    const w = WORD_BY_ID[id];
    const answer = n === 1 ? w.en : plural(id);
    const options = shuffle(opts || [w.en, w.en + 's']);
    return { type:'pickForm', scored:true, id, n, before: n === 1 ? 'a' : NUM_EN[n], options, answer, fbEn:countEn(id,n), fbRu:ruCount(id,n), note:trickyNote(id) };
  },
  yesNo(id, formMode){
    const n = rnd25();
    if(formMode){
      const wrong = Math.random() < .5;
      return { type:'yesNo', scored:true, id, n, phrase: wrong ? `${NUM_EN[n]} ${WORD_BY_ID[id].en}s` : countEn(id,n), answer: !wrong, fbEn:countEn(id,n), fbRu:ruCount(id,n), note:trickyNote(id) };
    }
    const shown = Math.random() < .5 ? n : shuffle([1,2,3,4,5].filter(x=>x!==n))[0];
    return { type:'yesNo', scored:true, id, n:shown, phrase: countEn(id,n), answer: shown === n, fbEn:countEn(id,shown), fbRu:ruCount(id,shown) };
  },
  build(id, n){
    const w = WORD_BY_ID[id];
    const answer = n === 1 ? ['a', w.en] : [NUM_EN[n], plural(id)];
    const extra = n === 1 ? [w.en + 's', NUM_EN[rnd25()]] : [w.en, 'a'];
    return { type:'build', scored:true, id, n, ru:ruCount(id,n), answer, bank: shuffle([...answer, ...extra]), fbEn:countEn(id,n), fbRu:ruCount(id,n) };
  },
  typeWord(id, n){
    return { type:'typeWord', scored:true, id, n, before:NUM_EN[n], answer:plural(id), hintRu:ruCount(id,n), fbEn:countEn(id,n), fbRu:ruCount(id,n), note:trickyNote(id) };
  },
  fixError(id, n){
    const fixed = PLURAL_IRREGULAR[id] ? `<b class="hl">${plural(id)}</b>` : `${WORD_BY_ID[id].en}<b class="hl">s</b>`;
    return { type:'fixError', scored:true, id, n, words:[NUM_EN[n], WORD_BY_ID[id].en], wrongIdx:1, fixed, fbEn:countEn(id,n), fbRu:ruCount(id,n) };
  },
};

/* ---- Станции правил из data/grammar.js ---- */
// Найти пропуск в предложении как отдельное слово (не часть другого слова)
function findGap(en, gap){
  const isL = ch => /[A-Za-z']/.test(ch || '');
  for(const hay of [en, en.toLowerCase()]){
    const needle = hay === en ? gap : gap.toLowerCase();
    let i = hay.indexOf(needle);
    while(i > -1){
      if(!isL(hay[i-1]) && !isL(hay[i + needle.length])) return i;
      i = hay.indexOf(needle, i + 1);
    }
  }
  return -1;
}
function hlText(en, hl){
  const i = hl ? findGap(en, hl) : -1;
  if(i < 0) return esc(en);
  return esc(en.slice(0, i)) + `<b class="hl">${esc(en.slice(i, i + hl.length))}</b>` + esc(en.slice(i + hl.length));
}
const isOneWord = s => /^[A-Za-z']+$/.test(s);
const sentenceTokens = en => en.replace(/[.,!?…]/g, '').split(/\s+/).filter(Boolean);
function grammarItem([en, ru, gap, ...opts]){
  const at = findGap(en, gap);
  return { en, ru, gap, opts, pre: en.slice(0, at), post: en.slice(at + gap.length), ok: at > -1 };
}
function buildGrammarSteps(spec){
  const items = shuffle(spec.items.map(grammarItem).filter(it=>it.ok && it.opts.length));
  const steps = spec.rules.map(r=>({ type:'rule', title:r.title, text:r.text,
    body: r.ex.map(([en, ru, hl])=>exampleRow(en, '', hlText(en, hl), ru)).join('') }));
  // Задания по кругу: разные типы, разные предложения
  const plan = ['pickGap', 'isRight', 'build', 'fixWord', 'typeGap', 'pickGap', 'build', 'isRight', 'fixWord', 'typeGap', 'pickGap'];
  let k = 0;
  const takeItem = test => {
    for(let tries = 0; tries < items.length; tries++){
      const it = items[(k + tries) % items.length];
      if(test(it)){ k = (k + tries + 1) % items.length; return it; }
    }
    return null;
  };
  plan.forEach(type=>{
    let it, step;
    if(type === 'pickGap' && (it = takeItem(()=>true)))
      step = { type, pre:it.pre, post:it.post, options:shuffle([it.gap, ...it.opts]), answer:it.gap, ru:it.ru };
    if(type === 'typeGap' && (it = takeItem(x=>isOneWord(x.gap))))
      step = { type, pre:it.pre, post:it.post, answer:it.gap, ru:it.ru };
    if(type === 'build' && (it = takeItem(x=>sentenceTokens(x.en).length <= 8))){
      const answer = sentenceTokens(it.en);
      const extra = it.opts.filter(isOneWord).slice(0, 2).filter(o=>!answer.includes(o));
      step = { type, ru:it.ru, answer, bank:shuffle([...answer, ...extra]) };
    }
    if(type === 'fixWord' && (it = takeItem(x=>isOneWord(x.gap) && isOneWord(x.opts[0])))){
      const words = sentenceTokens(it.pre + it.opts[0] + it.post);
      step = { type, words, wrongIdx: sentenceTokens(it.pre).length, fixed: esc(it.gap), ru:it.ru };
    }
    if(type === 'isRight' && (it = takeItem(()=>true))){
      const right = Math.random() < .5;
      step = { type, phrase: right ? it.en : it.pre + it.opts[0] + it.post, answer: right, ru:it.ru };
    }
    if(step) steps.push({ ...step, scored:true, fbEn:it.en, fbRu:it.ru });
  });
  if(spec.story){
    steps.push({ type:'story', title:spec.story.title, frame:0,
      frames: spec.story.frames.map(([en, ru, pics])=>({ en, ru, pics, html:esc(en) })) });
    spec.story.questions.forEach(([q, ru, options, answer, pics])=>{
      steps.push({ type:'question', scored:true, q, ru, options:shuffle(options), answer, pics, fbEn:answer, fbRu:'' });
    });
  }
  return steps;
}
function grammarChips(spec){
  return spec.items.slice(0, 6).map(([en])=>
    `<button class="word-chip phrase-chip" onclick="speak(${jsq(en)})" aria-label="Послушать"><span>${esc(en)}</span></button>`).join('');
}

function soundAt(w, side){
  const en = w.en.toLowerCase(), lab = side.label.toLowerCase();
  return side.last ? en.lastIndexOf(lab) : en.indexOf(lab);
}
function soundHtml(w, side, cls){
  const i = soundAt(w, side);
  if(i < 0) return esc(w.en);
  return esc(w.en.slice(0, i)) + `<b class="${cls}">${esc(w.en.slice(i, i + side.label.length))}</b>` + esc(w.en.slice(i + side.label.length));
}
